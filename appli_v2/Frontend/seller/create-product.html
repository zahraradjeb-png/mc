<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un Article — Gold Seller Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles/seller-base.css">
  <link rel="stylesheet" href="styles/seller-layout.css">
  <link rel="stylesheet" href="styles/seller-create-product.css">
</head>

<body class="seller-studio">

  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu"><i class="fas fa-bars"></i></button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div id="studio-toast"></div>

  <div class="studio-layout">
    <div id="sidebar-container"></div>

    <main class="studio-main animate-slide">
      <div id="header-container"></div>

      <form id="create-product-form" novalidate>
        <div class="editor-grid">

          <!-- ── LEFT COLUMN ── -->
          <div class="editor-col">

            <!-- Informations générales -->
            <section class="studio-card form-section">
              <h3 class="section-title"><i class="fas fa-info-circle"></i> Informations Générales</h3>
              <div class="form-group">
                <label class="label" for="p-titre">Titre de l'annonce <span class="req">*</span></label>
                <input type="text" id="p-titre" name="titre" class="input-studio"
                  placeholder="Ex : Pressage original Blue Note 1959…" required autocomplete="off">
              </div>
              <div class="form-group">
                <label class="label" for="p-description">Description <span class="req">*</span></label>
                <textarea id="p-description" name="description" class="input-studio"
                  placeholder="Décrivez l'objet : état, histoire, particularités…" rows="5" required></textarea>
              </div>
            </section>

            <!-- Détails musicaux (conditionnel) -->
            <section class="studio-card form-section" id="music-fields"
              style="display:none; border-color:rgba(229,166,87,0.3);">
              <h3 class="section-title" style="color:var(--studio-honey)"><i class="fas fa-music"></i> Détails Musicaux
              </h3>
              <div class="form-group">
                <label class="label" for="p-artiste">Artiste / Groupe</label>
                <input type="text" id="p-artiste" name="artiste" class="input-studio" placeholder="Ex : Miles Davis">
              </div>
              <div class="form-row" style="margin-top:16px;">
                <div class="form-group">
                  <label class="label" for="p-annee">Année de pressage</label>
                  <input type="number" id="p-annee" name="annee" class="input-studio" placeholder="1965" min="1900"
                    max="2030">
                </div>
                <div class="form-group">
                  <label class="label" for="p-decennie">Décennie</label>
                  <select id="p-decennie" name="decennie" class="input-studio">
                    <option value="">Sélectionner…</option>
                    <option value="1950">Années 50</option>
                    <option value="1960">Années 60</option>
                    <option value="1970">Années 70</option>
                    <option value="1980">Années 80</option>
                    <option value="1990">Années 90</option>
                    <option value="2000">Années 2000</option>
                  </select>
                </div>
              </div>

              <div id="music-base-fields" style="display:none; margin-top:16px;">
                <div class="form-row">
                  <div class="form-group">
                    <label class="label" for="p-label">Label / Éditeur</label>
                    <input type="text" id="p-label" name="label" class="input-studio" placeholder="Ex : Columbia">
                  </div>
                  <div class="form-group">
                    <label class="label" for="p-genre">Genre musical</label>
                    <input type="text" id="p-genre" name="genre" class="input-studio" placeholder="Ex : Jazz, Rock...">
                  </div>
                </div>
              </div>

              <div id="cd-fields" style="display:none; margin-top:16px;">
                <div class="form-group">
                  <label class="label" for="p-pistes">Nombre de pistes</label>
                  <input type="number" id="p-pistes" name="nb_pistes" class="input-studio" placeholder="Ex : 12">
                </div>
              </div>

              <div id="cassette-fields" style="display:none; margin-top:16px;">
                <div class="form-group">
                  <label class="label" for="p-duree">Durée (minutes)</label>
                  <input type="number" id="p-duree" name="duree_min" class="input-studio" placeholder="Ex : 60">
                </div>
              </div>
            </section>

            <!-- Photos -->
            <section class="studio-card form-section">
              <h3 class="section-title">
                <i class="fas fa-camera"></i> Photos du Produit
                <span class="section-hint">Max 4 photos · La première = photo principale</span>
              </h3>
              <div class="media-dropzone" id="dropzone" onclick="document.getElementById('p-img').click()">
                <div class="dropzone-inner">
                  <i class="fas fa-cloud-upload-alt"></i>
                  <p>Cliquez ou glissez vos photos ici</p>
                  <span>JPG, PNG, WEBP — Max 5 Mo chacune</span>
                </div>
                <input type="file" id="p-img" name="photos[]" style="display:none" accept="image/*" multiple>
              </div>
              <div id="preview-container" class="preview-container">
                <div class="preview-grid" id="preview-grid"></div>
              </div>
            </section>

          </div>

          <!-- ── RIGHT COLUMN ── -->
          <div class="editor-col">

            <!-- Catégorie & Caractéristiques -->
            <section class="studio-card form-section">
              <h3 class="section-title"><i class="fas fa-tags"></i> Catégorie &amp; Caractéristiques</h3>
              <div class="form-group">
                <label class="label" for="cat-select">Catégorie <span class="req">*</span></label>
                <select id="cat-select" name="id_categorie" class="input-studio" required>
                  <option value="">Choisir une catégorie…</option>
                  <option value="1" data-type="CD">💿 CD</option>
                  <option value="2" data-type="CASSETTE">📼 Cassette Audio</option>
                  <option value="3" data-type="VINYLE">🎵 Vinyle</option>
                  <option value="4" data-type="POSTER">🖼️ Poster / Affiche</option>
                  <option value="5" data-type="INSTRUMENT">🎸 Instrument</option>
                </select>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="label" for="p-rarete">Rareté</label>
                  <select id="p-rarete" name="rarete" class="input-studio">
                    <option value="COMMUN">Commun</option>
                    <option value="RARE">Rare</option>
                    <option value="TRES_RARE">Très Rare</option>
                    <option value="COLLECTOR">Collector</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="label" for="p-etat">État</label>
                  <select id="p-etat" name="etat" class="input-studio">
                    <option value="NEUF">Neuf</option>
                    <option value="BON">Bon état</option>
                    <option value="ACCEPTABLE">Acceptable</option>
                    <option value="ABIME">Abîmé</option>
                  </select>
                </div>
              </div>
            </section>

            <!-- Prix & Stock -->
            <section class="studio-card form-section pricing-card">
              <h3 class="section-title"><i class="fas fa-euro-sign"></i> Prix &amp; Stock</h3>
              <div class="price-highlight">
                <label class="label" for="p-prix">Prix de vente <span class="req">*</span></label>
                <div class="price-input-wrap">
                  <span class="price-currency">€</span>
                  <input type="number" id="p-prix" name="prix" class="input-studio price-input" placeholder="0,00"
                    step="0.01" min="0" required>
                </div>
              </div>
              <div class="form-group" style="margin-top:18px">
                <label class="label" for="p-quantite">Quantité en stock <span class="req">*</span></label>
                <div class="qty-stepper">
                  <button type="button" class="qty-btn" id="qty-minus"><i class="fas fa-minus"></i></button>
                  <input type="number" id="p-quantite" name="quantite" class="input-studio qty-field" value="1" min="1"
                    required>
                  <button type="button" class="qty-btn" id="qty-plus"><i class="fas fa-plus"></i></button>
                </div>
              </div>
              <div class="visibility-toggle">
                <label class="toggle-label">
                  <input type="checkbox" id="p-disponible" name="est_disponible" value="1" checked>
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <div class="toggle-text">
                    <span class="toggle-on">Visible dans la boutique</span>
                    <span class="toggle-hint">Les acheteurs pourront voir cet article</span>
                  </div>
                </label>
              </div>
            </section>

            <!-- Actions (sticky on desktop) -->
            <div class="form-actions-panel">
              <button type="submit" class="btn-gold-studio btn-full" id="pub-btn" form="create-product-form">
                <i class="fas fa-paper-plane"></i> Publier l'article
              </button>
              <button type="button" class="btn-ghost-studio btn-full" id="draft-btn">
                <i class="fas fa-save"></i> Enregistrer brouillon
              </button>
              <a href="products.html" class="btn-cancel">
                <i class="fas fa-arrow-left"></i> Retour aux produits
              </a>
            </div>

          </div>
        </div>
      </form>
    </main>
  </div>

  <script src="../js/api-config.js"></script>
  <script src="../js/auth-system.js"></script>
  <script src="services/seller-auth.js"></script>
  <script src="services/notifications.service.js"></script>
  <script src="services/products.service.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="components/header.js"></script>
  <script src="components/seller-layout.js"></script>
  <script src="scripts/create-product.js"></script>
</body>

</html>
