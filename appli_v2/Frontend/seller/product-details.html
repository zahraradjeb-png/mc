<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détails du Produit — Retro Market Studio</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles/seller-base.css">
  <link rel="stylesheet" href="styles/seller-layout.css">
  <link rel="stylesheet" href="styles/seller-product-details.css">
</head>

<body class="seller-studio">

  <div class="studio-layout">
    <div id="sidebar-container"></div>

    <main class="studio-main animate-slide">
      <header class="studio-header">
        <div class="welcome-msg">
          <p id="p-cat-mini">Vinyle Original</p>
          <h1 id="p-title-header">Pack Vinyle Jazz 1960</h1>
        </div>
        <div class="header-actions">
          <button class="btn-gold-studio" onclick="history.back()" style="background:rgba(255,255,255,0.05); color:#fff; box-shadow:none;">Retour</button>
          <a href="#" class="btn-gold-studio">
            <i class="fas fa-edit"></i> Modifier
          </a>
        </div>
      </header>

      <div class="product-details-grid">
        <div class="studio-card p-gallery-card">
          <img src="../assets/img/placeholder-vinyl.png" id="p-main-img" class="p-gallery-main">
        </div>

        <div class="studio-card p-info-card">
          <div class="p-header">
            <div>
              <span id="p-status-badge" class="badge-status">Statut</span>
              <h2 class="p-title" id="p-title">Chargement...</h2>
            </div>
            <div id="p-price" style="font-size: 2rem; font-weight: 700; color: var(--studio-honey);">0.00 €</div>
          </div>
          
          <p id="p-desc" style="opacity: 0.8; line-height: 1.7; font-size: 1.05rem;">
            ...
          </p>

          <div class="p-stat-group">
            <div class="p-mini-stat">
              <span class="p-ms-lbl">Stock disponible</span>
              <span class="p-ms-val" id="p-stock">0</span>
            </div>
            <div class="p-mini-stat">
              <span class="p-ms-lbl">Catégorie</span>
              <span class="p-ms-val" id="p-category">...</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Common Libraries -->
  <script src="../js/api-config.js"></script>
  <script src="../js/auth-system.js"></script>
  
  <!-- Modular Services -->
  <script src="services/seller-auth.js"></script>
  <script src="services/notifications.service.js"></script>
  <script src="services/products.service.js"></script>
  
  <!-- Shared Components -->
  <script src="components/sidebar.js"></script>
  <script src="components/header.js"></script>
  <script src="components/seller-layout.js"></script>
  
  <!-- Page Logic -->
  <script src="scripts/product-details.js"></script>
</body>
</html>
