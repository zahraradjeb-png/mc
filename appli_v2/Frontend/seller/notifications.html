<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — Gold Seller Studio</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles/seller-base.css">
  <link rel="stylesheet" href="styles/seller-layout.css">
  <link rel="stylesheet" href="styles/seller-notifications.css">
</head>

<body class="seller-studio">

  <div class="studio-layout">
    <div id="sidebar-container"></div>

    <main class="studio-main animate-slide">
      <header class="studio-header">
        <div class="welcome-msg">
          <p>Centre d'activité</p>
          <h1>Mes Notifications</h1>
        </div>
        <div class="header-actions">
           <button class="btn-gold-studio" id="btn-mark-all-read" style="background:rgba(255,255,255,0.05); color:#fff; box-shadow:none;">
             <i class="fas fa-check-double" style="margin-right:6px;"></i>Tout marquer comme lu
           </button>
        </div>
      </header>

      <div class="studio-card" style="padding:0; overflow:hidden;" id="notif-list">
        <!-- Chargement dynamique via JS -->
        <div style="padding:60px; text-align:center;">
          <i class="fas fa-spinner fa-spin" style="font-size:1.5rem; opacity:0.3;"></i>
          <p style="margin-top:12px; opacity:0.4;">Chargement des notifications...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Common Libraries -->
  <script src="../js/api-config.js"></script>
  <script src="../js/auth-system.js"></script>
  
  <!-- Modular Services -->
  <script src="services/seller-auth.js"></script>
  <script src="services/notifications.service.js"></script>
  
  <!-- Shared Components -->
  <script src="components/sidebar.js"></script>
  <script src="components/header.js"></script>
  <script src="components/seller-layout.js"></script>
  
  <!-- Page Script -->
  <script src="scripts/notifications.js"></script>
</body>
</html>
