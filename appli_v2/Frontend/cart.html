<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier — Gold Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/buyer.css">
  <style>
    :root { --crumpet: #1c1719; --ink: #f5e2ce; --ink2: #272124; --honey: #e5a657; --biscuit: #383033; --paprika: #b53324; }
    body { font-family: 'Outfit', sans-serif; background: var(--crumpet); color: var(--ink); margin:0; }
    .navbar { background: #1c1719 !important; border-bottom: 1px solid var(--biscuit); padding: 15px 0; }
    .cart-item { background: var(--ink2); border: 1px solid var(--biscuit); border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
    .cart-thumb { width: 70px; height: 70px; background: var(--biscuit); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2rem; overflow:hidden; }
    .cart-thumb img { width:100%; height:100%; object-fit:cover; }
    .cart-details { flex: 1; }
    .cart-price { color: var(--honey); font-weight: 600; font-size: 1.2rem; font-family: 'Cormorant Garamond', serif; }
    .btn-remove { background: none; border: none; color: var(--paprika); cursor: pointer; font-size: 1.2rem; }
    .btn-main { width: 100%; padding: 15px; background: var(--honey); color: #111; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
<header class="navbar scrolled"><div class="nav-wrap"><a href="index.html" class="logo" style="color:var(--ink) !important; text-decoration:none; font-size: 1.8rem; font-weight: 600;">Retro<span>Market</span></a></div></header>

<section style="padding: 100px 0;">
  <div class="wrap">
    <h1 style="font-family:'Cormorant Garamond',serif; font-size:3.5rem; margin-bottom:40px;">Votre <em>Panier</em></h1>

    <div id="cartView" style="display:none; grid-template-columns: 1fr 350px; gap: 40px;">
      <div id="itemsContainer"></div>
      <div style="background:var(--ink2); padding:25px; border-radius:12px; border:1px solid var(--biscuit); height:fit-content;">
        <h3 style="margin-top:0">Total Commande</h3>
        <div style="display:flex; justify-content:space-between; margin:25px 0; font-size:1.8rem; font-weight:700; color:var(--honey); font-family:'Cormorant Garamond',serif;">
          <span>Total</span>
          <span id="finalPrice">0,00 €</span>
        </div>
        <button class="btn-main" onclick="startCheckout()">Passer au paiement</button>
      </div>
    </div>

    <div id="emptyView" style="display:none; text-align:center; padding:80px 20px; background:var(--ink2); border-radius:16px; border:1px dashed var(--biscuit);">
      <div style="font-size:4rem; margin-bottom:20px; opacity:0.3;">🛒</div>
      <h2 style="font-family:'Cormorant Garamond',serif; font-size:2.5rem;">Panier vide</h2>
      <a href="catalogue.html" style="color:var(--honey); text-decoration:underline; font-size:1.1rem;">Retourner au catalogue</a>
    </div>
  </div>
</section>

<script src="js/api-config.js"></script>
<script src="js/auth-system.js"></script>
<script src="js/main.js"></script>
<script>
function refresh() {
  const container = document.getElementById('itemsContainer');
  const priceEl = document.getElementById('finalPrice');
  const cartView = document.getElementById('cartView');
  const emptyView = document.getElementById('emptyView');

  let items = [];
  try {
    const raw = localStorage.getItem('gold_cart');
    items = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(items)) items = [];
  } catch(e) { items = []; }

  if (items.length === 0) {
    cartView.style.display = 'none';
    emptyView.style.display = 'block';
  } else {
    emptyView.style.display = 'none';
    cartView.style.display = 'grid';
    
    let total = 0;
    container.innerHTML = items.map((it, i) => {
      const p = parseFloat(it.price || 0);
      const q = parseInt(it.qty || 1);
      total += p * q;
      return `
        <div class="cart-item">
          <div class="cart-thumb">${it.image ? `<img src="${it.image}">` : '🎵'}</div>
          <div class="cart-details">
            <div style="font-size:1.3rem; font-weight:600; color:#fff;">${it.name || 'Produit'}</div>
            <div style="color:rgba(245,226,206,0.5); font-size:0.9rem; margin-top:5px;">Quantité : ${q}</div>
          </div>
          <div class="cart-price">${(p * q).toFixed(2).replace('.',',')} €</div>
          <button class="btn-remove" onclick="removeOne('${it.id}')"><i class="fas fa-trash"></i></button>
        </div>
      `;
    }).join('');
    priceEl.textContent = total.toFixed(2).replace('.', ',') + ' €';
  }
  if (typeof updateCartBadges === 'function') updateCartBadges();
}

async function removeOne(id) {
  if (typeof GoldAuth !== 'undefined') {
    await GoldAuth.removeFromCart(id);
    refresh();
  }
}

function startCheckout() {
  if (typeof GoldAuth !== 'undefined' && !GoldAuth.isLoggedIn()) {
    showToast('Veuillez vous connecter pour payer', 'info');
    setTimeout(() => window.location.href = 'authentification/sign-in.html', 1000);
  } else {
    window.location.href = 'acheteur/checkout%20commande.html';
  }
}

// Lancement immédiat avec synchronisation
async function initCart() {
  if (typeof GoldAuth !== 'undefined' && GoldAuth.isLoggedIn() && GoldAuth.isBuyer()) {
    await GoldAuth.syncCartFromServer();
  }
  refresh();
}

initCart();

// Lancement après chargement complet au cas où
window.onload = initCart;
</script>
</body>
</html>
