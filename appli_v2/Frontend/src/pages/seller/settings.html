<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres — Seller Studio | Gold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/seller-studio.css">
    <style>
        .settings-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 18px; padding: 32px; margin-bottom: 24px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .form-group.full { grid-column: span 2; }
        .form-label { font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); }
        .form-input, .form-textarea { width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-light); border-radius: 8px; color: white; font-family: 'Jost', sans-serif; font-size: 0.9rem; }
        .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
    </style>
</head>
<body class="seller-layout">
    
    <div id="seller-sidebar-container"></div>

    <main class="seller-main">
        <div id="seller-topbar-container"></div>

        <div class="seller-content" style="max-width: 900px; margin: 0 auto;">
            <div style="margin-bottom: 32px">
                <h2 class="page-title" style="font-size: 2rem;">Paramètres de la <em>Boutique</em></h2>
                <p style="color:var(--text-secondary); font-size:0.88rem; margin-top:4px">Configurez votre identité visuelle et vos informations de contact.</p>
            </div>

            <form id="settings-form">
                <!-- SHOP CONFIG -->
                <div class="settings-card">
                    <h3 style="font-family:'Cormorant',serif; font-size:1.4rem; margin-bottom:24px; color:var(--accent)">Identité Boutique</h3>
                    <div class="form-grid">
                        <div class="form-group full">
                            <label class="form-label">Nom de la boutique public</label>
                            <input type="text" name="nom_boutique" id="shop-name" class="form-input">
                        </div>
                        <div class="form-group full">
                            <label class="form-label">Bio / Description courte</label>
                            <textarea name="description_boutique" id="shop-bio" class="form-textarea" rows="4"></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Adresse de la boutique</label>
                            <input type="text" name="adresse" id="shop-addr" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email de contact boutique</label>
                            <input type="email" name="email_boutique" id="shop-email" class="form-input">
                        </div>
                    </div>
                </div>

                <!-- ACCOUNT CONFIG -->
                <div class="settings-card">
                    <h3 style="font-family:'Cormorant',serif; font-size:1.4rem; margin-bottom:24px; color:var(--accent)">Informations Compte</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Prénom</label>
                            <input type="text" name="prenom" id="user-fname" class="form-input" readonly>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nom</label>
                            <input type="text" name="nom" id="user-lname" class="form-input" readonly>
                        </div>
                        <div class="form-group full">
                            <label class="form-label">Email personnel</label>
                            <input type="email" name="email" id="user-email" class="form-input" readonly>
                            <span style="font-size:0.7rem; color:var(--text-secondary); margin-top:4px">L'email de compte ne peut pas être modifié ici pour des raisons de sécurité.</span>
                        </div>
                    </div>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:16px; margin-bottom:80px">
                    <button type="submit" style="padding:14px 48px; background:var(--accent); color:var(--bg-dark); border:none; border-radius:10px; font-weight:700; cursor:pointer; font-size:1rem; box-shadow:0 8px 32px rgba(229,166,87,0.2)">Sauvegarder les modifications</button>
                </div>
            </form>
        </div>
    </main>

    <script src="../../js/core/auth-system.js"></script>
    <script src="../../js/core/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = GoldAuth.getUser();
            if (!user) return;

            GoldComponents.injectSellerSidebar('settings');
            GoldComponents.injectSellerTopbar('Paramètres');

            // Pre-fill form
            document.getElementById('shop-name').value = user.nom_boutique || '';
            document.getElementById('shop-bio').value = user.description_boutique || '';
            document.getElementById('shop-addr').value = user.adresse || '';
            document.getElementById('shop-email').value = user.email_boutique || user.email;
            document.getElementById('user-fname').value = user.prenom || '';
            document.getElementById('user-lname').value = user.nom || '';
            document.getElementById('user-email').value = user.email || '';

            const form = document.getElementById('settings-form');
            form.onsubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                try {
                   showToast("Mise à jour en cours...", "info");
                   const res = await fetch(`http://localhost:8000/api/vendeurs/${user.id_vendeur || user.id}/profil`, {
                       method: 'PUT',
                       headers: { 'Content-Type': 'application/json' },
                       body: JSON.stringify(data)
                   });

                   if (res.ok) {
                       const updatedUser = await res.json();
                       // Update local storage user data
                       const finalUser = { ...user, ...data };
                       GoldAuth.setUser(finalUser);
                       showToast("Profil mis à jour avec succès !", "ok");
                   } else {
                       showToast("Erreur lors de la mise à jour", "error");
                   }
                } catch (err) {
                    showToast("Erreur serveur", "error");
                }
            };
        });
    </script>
</body>
</html>
