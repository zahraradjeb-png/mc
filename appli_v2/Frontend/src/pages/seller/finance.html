<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance & Revenus — Seller Studio | Gold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/seller-studio.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .finance-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 18px; padding: 24px; }
        .balance-hero { background: linear-gradient(135deg, #B53324, #E5A657); border-radius: 20px; padding: 40px; color: var(--bg-dark); position: relative; overflow: hidden; margin-bottom: 24px; }
        .balance-hero::after { content: '€'; position: absolute; top: -20px; right: -20px; font-size: 15rem; font-family: 'Special Elite', cursive; opacity: 0.1; color: white; pointer-events: none; }
        .balance-lbl { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.8; }
        .balance-val { font-size: 3.5rem; font-weight: 700; font-family: 'Special Elite', cursive; margin: 10px 0; }
        .balance-btn { background: white; color: var(--bg-dark); border: none; padding: 12px 24px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .balance-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .table-row { border-bottom: 1px solid rgba(229,166,87,0.05); }
    </style>
</head>
<body class="seller-layout">
    
    <div id="seller-sidebar-container"></div>

    <main class="seller-main">
        <div id="seller-topbar-container"></div>

        <div class="seller-content">
            <div style="margin-bottom: 32px">
                <h2 class="page-title" style="font-size: 2rem;">Finance & <em>Revenus</em></h2>
                <p style="color:var(--text-secondary); font-size:0.88rem; margin-top:4px">Gérez vos gains et demandez vos virements.</p>
            </div>

            <div class="balance-hero">
                <div class="balance-lbl">Solde Disponible</div>
                <div class="balance-val" id="solde-val">0.00 €</div>
                <div style="display:flex; justify-content:space-between; align-items:flex-end">
                    <p style="font-size:0.85rem; max-width:300px; opacity:0.8; font-weight:500">Ce solde représente vos gains nets après commission Gold (8%).</p>
                    <button class="balance-btn" onclick="requestPayout()">Retirer les gains</button>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 2fr 1fr; gap: 24px;">
                <!-- GRAPH RECHTS -->
                <div class="finance-card">
                    <h3 style="font-family:'Cormorant',serif; font-size:1.4rem; margin-bottom:24px; color:var(--accent)">Évolution de vos gains</h3>
                    <canvas id="revenueChart" height="150"></canvas>
                </div>

                <!-- HISTORY -->
                <div class="finance-card">
                    <h3 style="font-family:'Cormorant',serif; font-size:1.4rem; margin-bottom:24px; color:var(--accent)">Historique</h3>
                    <div id="transaction-list">
                        <div style="text-align:center; padding:40px; color:var(--text-secondary); opacity:0.5">
                            <i class="fas fa-spinner fa-spin" style="margin-bottom:10px"></i> Chargement...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/core/auth-system.js"></script>
    <script src="../../js/core/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = GoldAuth.getUser();
            if (!user) return;

            GoldComponents.injectSellerSidebar('finance');
            GoldComponents.injectSellerTopbar('Finance & Revenus');

            await loadFinanceData();
        });

        async function loadFinanceData() {
            const user = GoldAuth.getUser();
            try {
                const res = await fetch(`http://localhost:8000/api/vendeurs/${user.id_vendeur || user.id}/finance`);
                if (res.ok) {
                    const data = await res.json();
                    renderFinance(data);
                }
            } catch (e) { console.error("Load finance error:", e); }
        }

        function renderFinance(data) {
            document.getElementById('solde-val').textContent = `${data.solde} €`;
            
            // Transaction history (Simplified for now)
            const list = document.getElementById('transaction-list');
            if (!data.history || data.history.length === 0) {
                list.innerHTML = '<p style="text-align:center; padding:40px; opacity:0.4">Aucune transaction.</p>';
            } else {
                list.innerHTML = data.history.map(t => `
                    <div style="padding:16px 0; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-size:0.85rem; font-weight:600">${t.type === 'Vente' ? 'Vente de produit' : 'Virement'}</div>
                            <div style="font-size:0.75rem; color:var(--text-secondary)">${new Date(t.date).toLocaleDateString()}</div>
                        </div>
                        <div style="font-weight:700; color:${t.type === 'Vente' ? '#16a34a' : 'white'}">
                            ${t.type === 'Vente' ? '+' : '-'}${t.montant} €
                        </div>
                    </div>
                `).join('');
            }

            // Render Chart.js
            initChart(data.chart_data);
        }

        function initChart(chartData) {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            const labels = chartData?.labels || ['Jan', 'Féb', 'Mar', 'Avr', 'Mai', 'Juin'];
            const points = chartData?.points || [0, 0, 0, 0, 0, 0];

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Revenus (€)',
                        data: points,
                        borderColor: '#E5A657',
                        backgroundColor: 'rgba(229, 166, 87, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 3,
                        pointRadius: 4,
                        pointBackgroundColor: '#E5A657'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: 'rgba(245,226,206,0.5)' }
                        },
                        x: { 
                            grid: { display: false },
                            ticks: { color: 'rgba(245,226,206,0.5)' }
                        }
                    }
                }
            });
        }

        function requestPayout() {
            showToast("Demande de virement envoyée aux administrateurs.", "ok");
        }
    </script>
</body>
</html>
