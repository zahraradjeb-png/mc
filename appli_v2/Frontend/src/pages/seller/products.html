<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Produits — Seller Studio | Gold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/seller-studio.css">
</head>
<body class="seller-layout">
    
    <!-- SIDEBAR -->
    <div id="seller-sidebar-container"></div>

    <!-- MAIN -->
    <main class="seller-main">
        <!-- TOPBAR -->
        <div id="seller-topbar-container"></div>

        <div class="seller-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px">
                <div>
                    <h2 class="page-title" style="font-size: 2rem;">Gestion des <em>Produits</em></h2>
                    <p style="color:var(--text-secondary); font-size:0.88rem; margin-top:4px">Gérez votre inventaire et vos annonces en temps réel.</p>
                </div>
                <a href="products/create.html" class="nav-link" style="background:var(--accent); color:var(--bg-dark); border-radius:10px; font-weight:600; padding:12px 24px">
                    <i class="fas fa-plus"></i>
                    <span>Ajouter un produit</span>
                </a>
            </div>

            <!-- FILTERS & SEARCH -->
            <div class="stat-card" style="padding:16px 24px; margin-bottom:24px; flex-direction:row; align-items:center; gap:20px">
                <div style="flex:1; position:relative">
                    <i class="fas fa-search" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:0.4"></i>
                    <input type="text" id="product-search" placeholder="Rechercher par titre, artiste, année..." 
                           style="width:100%; padding:10px 14px 10px 40px; background:rgba(0,0,0,0.1); border:1px solid var(--border-light); border-radius:8px; color:white; font-size:0.85rem">
                </div>
                <div style="display:flex; gap:12px">
                    <select id="filter-cat" style="padding:10px 14px; background:var(--bg-card); border:1px solid var(--border-light); border-radius:8px; color:white; font-size:0.85rem">
                        <option value="">Toutes les catégories</option>
                        <option value="1">CDs</option>
                        <option value="2">Cassettes</option>
                        <option value="3">Vinyles</option>
                        <option value="4">Posters</option>
                        <option value="5">Instruments</option>
                    </select>
                </div>
            </div>

            <!-- PRODUCTS TABLE -->
            <div class="stat-card" style="padding:0; overflow:hidden">
                <div id="products-table-container">
                    <div style="text-align:center; padding:80px; color:var(--text-secondary)">
                        <i class="fas fa-spinner fa-spin" style="font-size:2rem; margin-bottom:15px"></i>
                        <p>Chargement de votre catalogue...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="../../js/core/auth-system.js"></script>
    <script src="../../js/core/components.js"></script>
    <script>
        let allProducts = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = GoldAuth.getUser();
            if (!user) return;

            GoldComponents.injectSellerSidebar('products');
            GoldComponents.injectSellerTopbar('Mes Produits');

            await loadProducts();

            // Search & Filter events
            document.getElementById('product-search').addEventListener('input', filterProducts);
            document.getElementById('filter-cat').addEventListener('change', filterProducts);
        });

        async function loadProducts() {
            const user = GoldAuth.getUser();
            try {
                const res = await fetch(`http://localhost:8000/api/produits?id_vendeur=${user.id_vendeur || user.id}`);
                if (res.ok) {
                    allProducts = await res.json();
                    renderProducts(allProducts);
                }
            } catch (e) {
                console.error("Load products error:", e);
                document.getElementById('products-table-container').innerHTML = '<p style="padding:40px; text-align:center; color:#B53324">Erreur de chargement. Veuillez réessayer.</p>';
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('products-table-container');
            if (products.length === 0) {
                container.innerHTML = '<div style="padding:80px; text-align:center; opacity:0.4"><i class="fas fa-box-open" style="font-size:3rem; margin-bottom:15px; display:block"></i>Aucun produit trouvé.</div>';
                return;
            }

            container.innerHTML = `
                <table style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr style="text-align:left; color:var(--text-secondary); background:rgba(0,0,0,0.1); border-bottom:1px solid var(--border-light)">
                            <th style="padding:16px 20px; font-weight:500; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em">Produit</th>
                            <th style="padding:16px 20px; font-weight:500; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em">Catégorie</th>
                            <th style="padding:16px 20px; font-weight:500; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em">Prix</th>
                            <th style="padding:16px 20px; font-weight:500; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em">Stock</th>
                            <th style="padding:16px 20px; font-weight:500; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em">État</th>
                            <th style="padding:16px 20px; font-weight:500; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${products.map(p => `
                            <tr style="border-bottom:1px solid rgba(229,166,87,0.05); transition:background 0.2s" onmouseover="this.style.background='rgba(255,255,255,0.02)'" onmouseout="this.style.background='transparent'">
                                <td style="padding:16px 20px">
                                    <div style="display:flex; align-items:center; gap:12px">
                                        <div style="width:50px; height:50px; border-radius:8px; overflow:hidden; background:#000; flex-shrink:0; border:1px solid var(--border-light)">
                                            <img src="../../../${p.photo_principale || 'assets/images/placeholder.jpg'}" style="width:100%; height:100%; object-fit:cover" onerror="this.src='../../../assets/images/placeholder-product.jpg'">
                                        </div>
                                        <div>
                                            <div style="font-weight:600; color:white; font-size:0.92rem">${p.titre}</div>
                                            <div style="font-size:0.75rem; color:var(--text-secondary); margin-top:2px">${p.artiste || 'Artiste inconnu'} · ${p.annee || '-'}</div>
                                        </div>
                                    </div>
                                </td>
                                <td style="padding:16px 20px; font-size:0.85rem">
                                    <span style="padding:4px 10px; border-radius:100px; background:rgba(229,166,87,0.1); color:var(--accent); font-size:0.75rem">
                                        ${p.categorie_nom}
                                    </span>
                                </td>
                                <td style="padding:16px 20px; font-weight:700; color:white">${p.prix} €</td>
                                <td style="padding:16px 20px; font-size:0.85rem">
                                    <span style="color: ${p.quantite > 0 ? '#16a34a' : '#B53324'}">
                                        ${p.quantite} en stock
                                    </span>
                                </td>
                                <td style="padding:16px 20px; font-size:0.75rem; color:var(--text-secondary)">
                                    ${p.etat}
                                </td>
                                <td style="padding:16px 20px">
                                    <div style="display:flex; gap:8px">
                                        <button onclick="editProduct(${p.id_produit})" style="width:32px; height:32px; border-radius:8px; background:rgba(255,255,255,0.05); border:none; color:white; cursor:pointer; transition:all 0.2s" onmouseover="this.style.background='var(--accent)';this.style.color='var(--bg-dark)'" onmouseout="this.style.background='rgba(255,255,255,0.05)';this.style.color='white'">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button onclick="deleteProduct(${p.id_produit}, '${p.titre.replace(/'/g, "\\'")}')" style="width:32px; height:32px; border-radius:8px; background:rgba(181,51,36,0.1); border:none; color:#B53324; cursor:pointer; transition:all 0.2s" onmouseover="this.style.background='#B53324';this.style.color='white'" onmouseout="this.style.background='rgba(181,51,36,0.1)';this.style.color='#B53324'">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function filterProducts() {
            const search = document.getElementById('product-search').value.toLowerCase();
            const cat = document.getElementById('filter-cat').value;

            const filtered = allProducts.filter(p => {
                const matchSearch = p.titre.toLowerCase().includes(search) || (p.artiste && p.artiste.toLowerCase().includes(search));
                const matchCat = !cat || p.id_categorie == cat;
                return matchSearch && matchCat;
            });

            renderProducts(filtered);
        }

        async function deleteProduct(id, title) {
            if (!confirm(`Êtes-vous sûr de vouloir supprimer définitivement "${title}" ?`)) return;

            try {
                const res = await fetch(`http://localhost:8000/api/produits/${id}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    showToast("Produit supprimé avec succès");
                    loadProducts();
                }
            } catch (e) {
                showToast("Erreur lors de la suppression", "error");
            }
        }

        function editProduct(id) {
            window.location.href = `products/edit.html?id=${id}`;
        }
    </script>
</body>
</html>
