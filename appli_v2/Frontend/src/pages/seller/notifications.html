<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — Seller Studio | Gold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/seller-studio.css">
    <style>
        .notif-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 12px; padding: 20px; margin-bottom: 12px; display: flex; gap: 20px; transition: all 0.2s; cursor: pointer; }
        .notif-card:hover { border-color: var(--accent); background: rgba(229,166,87,0.05); }
        .notif-card.unread { border-left: 4px solid var(--accent); background: rgba(229,166,87,0.03); }
        .notif-icon { width: 44px; height: 44px; border-radius: 50%; background: rgba(229,166,87,0.1); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
        .notif-info { flex: 1; }
        .notif-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
        .notif-text { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; }
        .notif-time { font-size: 0.7rem; color: var(--text-secondary); opacity: 0.5; margin-top: 8px; }
    </style>
</head>
<body class="seller-layout">
    
    <div id="seller-sidebar-container"></div>

    <main class="seller-main">
        <div id="seller-topbar-container"></div>

        <div class="seller-content" style="max-width: 800px; margin: 0 auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px">
                <div>
                    <h2 class="page-title" style="font-size: 2rem;">Centre de <em>Notifications</em></h2>
                    <p style="color:var(--text-secondary); font-size:0.88rem; margin-top:4px">Restez informé de vos ventes, avis et alertes stock.</p>
                </div>
                <button onclick="markAllRead()" style="background:transparent; border:1px solid var(--border-light); color:var(--text-secondary); padding:8px 16px; border-radius:8px; font-size:0.75rem; cursor:pointer">Tout marquer comme lu</button>
            </div>

            <div id="notif-list">
                <div style="text-align:center; padding:80px; color:var(--text-secondary); opacity:0.5">
                    <i class="fas fa-spinner fa-spin" style="font-size:2rem; margin-bottom:15px; display:block"></i>
                    Chargement des notifications...
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/core/auth-system.js"></script>
    <script src="../../js/core/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = GoldAuth.getUser();
            if (!user) return;

            GoldComponents.injectSellerSidebar('notifications');
            GoldComponents.injectSellerTopbar('Notifications');

            await loadNotifs();
        });

        async function loadNotifs() {
            const user = GoldAuth.getUser();
            try {
                const res = await fetch(`http://localhost:8000/api/acheteurs/${user.id_user || user.id}/notifications`);
                if (res.ok) {
                    const notifs = await res.json();
                    renderNotifs(notifs);
                }
            } catch (e) { console.error("Load notifs error:", e); }
        }

        function renderNotifs(notifs) {
            const list = document.getElementById('notif-list');
            if (notifs.length === 0) {
                list.innerHTML = '<div style="padding:80px; text-align:center; opacity:0.4"><i class="fas fa-bell-slash" style="font-size:3rem; margin-bottom:15px; display:block"></i>Aucune notification pour le moment.</div>';
                return;
            }

            list.innerHTML = notifs.map(n => {
                const icon = n.type === 'Vente' ? 'fa-shopping-cart' : (n.type === 'Avis' ? 'fa-star' : 'fa-info-circle');
                return `
                    <div class="notif-card ${n.est_lue ? '' : 'unread'}" onclick="markRead(${n.id})">
                        <div class="notif-icon"><i class="fas ${icon}"></i></div>
                        <div class="notif-info">
                            <div class="notif-title">${n.titre}</div>
                            <div class="notif-text">${n.contenu}</div>
                            <div class="notif-time">${new Date(n.created_at).toLocaleString('fr-FR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function markRead(id) {
            const user = GoldAuth.getUser();
            try {
                await fetch(`http://localhost:8000/api/acheteurs/${user.id_user || user.id}/notifications/${id}/lue`, { method: 'PUT' });
                loadNotifs();
            } catch (e) {}
        }

        function markAllRead() {
            showToast("Toutes les notifications sont marquées comme lues.");
        }
    </script>
</body>
</html>
