<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Commandes — Seller Studio | Gold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/seller-studio.css">
    <style>
        .order-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 18px; padding: 24px; margin-bottom: 24px; }
        .order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 1px solid var(--border-light); padding-bottom: 16px; }
        .order-id { font-family: 'Special Elite', cursive; font-size: 1.1rem; color: var(--accent); }
        .order-date { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }
        .buyer-info { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .buyer-avatar { width: 32px; height: 32px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
        .item-row { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .item-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-light); }
        .item-info { flex: 1; }
        .item-status { font-size: 0.75rem; padding: 4px 10px; border-radius: 100px; }
        .status-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; font-weight: 700; }
        .st-prep { background: rgba(229,166,87,0.1); color: var(--accent); }
        .st-sent { background: rgba(22, 163, 74, 0.1); color: #16a34a; }
        .st-delivered { background: #16a34a; color: white; }
    </style>
</head>
<body class="seller-layout">
    
    <div id="seller-sidebar-container"></div>

    <main class="seller-main">
        <div id="seller-topbar-container"></div>

        <div class="seller-content">
            <div style="margin-bottom: 32px">
                <h2 class="page-title" style="font-size: 2rem;">Gestion des <em>Commandes</em></h2>
                <p style="color:var(--text-secondary); font-size:0.88rem; margin-top:4px">Suivez vos ventes et expédiez vos produits.</p>
            </div>

            <div id="orders-list">
                <div style="text-align:center; padding:80px; color:var(--text-secondary); opacity:0.5">
                    <i class="fas fa-spinner fa-spin" style="font-size:2rem; margin-bottom:15px; display:block"></i>
                    Chargement des commandes...
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/core/auth-system.js"></script>
    <script src="../../js/core/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = GoldAuth.getUser();
            if (!user) return;

            GoldComponents.injectSellerSidebar('orders');
            GoldComponents.injectSellerTopbar('Commandes');

            await loadOrders();
        });

        async function loadOrders() {
            const user = GoldAuth.getUser();
            try {
                const res = await fetch(`http://localhost:8000/api/vendeurs/${user.id_vendeur || user.id}/commandes`);
                if (res.ok) {
                    const orders = await res.json();
                    renderOrders(orders);
                }
            } catch (e) {
                console.error("Load orders error:", e);
                document.getElementById('orders-list').innerHTML = '<p style="padding:40px; text-align:center; color:#B53324">Erreur de chargement des commandes.</p>';
            }
        }

        function renderOrders(orders) {
            const list = document.getElementById('orders-list');
            if (orders.length === 0) {
                list.innerHTML = '<div style="padding:80px; text-align:center; opacity:0.4"><i class="fas fa-shopping-basket" style="font-size:3rem; margin-bottom:15px; display:block"></i>Vous n\'avez pas encore de commandes.</div>';
                return;
            }

            list.innerHTML = orders.map(o => `
                <div class="order-card">
                    <div class="order-header">
                        <div>
                            <div class="order-id">#${o.id_commande}</div>
                            <div class="order-date">${new Date(o.date_commande).toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'})}</div>
                        </div>
                        <div style="text-align:right">
                            <div style="font-size:1.4rem; font-weight:700">${o.total_vendeur} €</div>
                            <div style="font-size:0.75rem; color:var(--text-secondary)">Total pour vous</div>
                        </div>
                    </div>
                    
                    <div class="buyer-info">
                        <div class="buyer-avatar">${(o.prenom_acheteur||'A')[0].toUpperCase()}</div>
                        <div>
                            <div style="font-size:0.9rem; font-weight:600">${o.prenom_acheteur} ${o.nom_acheteur}</div>
                            <div style="font-size:0.75rem; color:var(--text-secondary)">${o.adresse_livraison || 'Adresse non renseignée'}</div>
                        </div>
                    </div>

                    <div class="order-items">
                        ${o.liste_produits.map(p => `
                            <div class="item-row">
                                <img src="../../../${p.photo_principale || 'assets/images/placeholder.jpg'}" class="item-img">
                                <div class="item-info">
                                    <div style="font-weight:600; font-size:0.9rem">${p.titre}</div>
                                    <div style="font-size:0.75rem; color:var(--text-secondary)">Réf: ${p.id_produit} · Qté: ${p.quantite_commandee}</div>
                                </div>
                                <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px">
                                    <span class="status-badge ${p.statut_vendeur==='PREPARATION'?'st-prep':(p.statut_vendeur==='EXPEDIE'?'st-sent':'st-delivered')}">
                                        ${p.statut_vendeur}
                                    </span>
                                    ${p.statut_vendeur === 'PREPARATION' ? `
                                        <button onclick="updateStatus(${o.id_commande}, ${p.id_produit}, 'EXPEDIE')" style="padding:6px 12px; background:var(--accent); color:var(--bg-dark); border:none; border-radius:6px; font-size:0.75rem; font-weight:700; cursor:pointer">
                                            Marquer comme expédié
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function updateStatus(orderId, productId, status) {
            const user = GoldAuth.getUser();
            try {
                const res = await fetch(`http://localhost:8000/api/vendeurs/${user.id_vendeur || user.id}/commandes/${orderId}/produit/${productId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: status })
                });
                
                if (res.ok) {
                    showToast("Statut mis à jour !");
                    loadOrders();
                } else {
                    showToast("Erreur lors de la mise à jour", "error");
                }
            } catch (e) {
                showToast("Erreur réseau", "error");
            }
        }
    </script>
</body>
</html>
