<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Favoris — Retro Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root { --crumpet: #1c1719; --ink: #f5e2ce; --ink2: #272124; --honey: #e5a657; --biscuit: #383033; --paprika: #b53324; }
    body { font-family: 'Outfit', sans-serif; background: var(--crumpet); color: var(--ink); margin:0; }
    .navbar { background: #1c1719 !important; border-bottom: 1px solid var(--biscuit); padding: 15px 0; }
    .fav-item { background: var(--ink2); border: 1px solid var(--biscuit); border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
    .fav-thumb { width: 120px; height: 120px; background: var(--biscuit); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; overflow:hidden; }
    .fav-thumb img { width:100%; height:100%; object-fit:cover; }
    .fav-details { flex: 1; display:flex; flex-direction:column; justify-content:center; }
    .fav-price { color: var(--honey); font-weight: 600; font-size: 1.3rem; font-family: 'Outfit', sans-serif; }
    .btn-action { background: none; border: 1px solid var(--biscuit); color: var(--ink); cursor: pointer; padding: 10px 15px; border-radius: 5px; transition: all 0.3s; font-size: 0.9rem; font-weight: 600; }
    .btn-action:hover { border-color: var(--honey); color: var(--honey); }
    .btn-remove { color: var(--paprika); border-color: rgba(181, 51, 36, 0.4); }
    .btn-remove:hover { border-color: var(--paprika); background: rgba(181, 51, 36, 0.1); color: var(--paprika); }
    .btn-cart { background: var(--honey); color: #111; border: none; }
    .btn-cart:hover { background: #c07d30; color: #111; }
    .product-link { text-decoration:none; display:block; transition: opacity 0.3s; }
    .product-link:hover { opacity: 0.8; }
  </style>
</head>
<body>
<header class="navbar scrolled"><div class="nav-wrap"><a href="index.html" class="logo" style="color:var(--ink) !important; text-decoration:none; font-size: 1.8rem; font-weight: 600; font-family: 'Cormorant Garamond', serif;">Retro<span style="color:var(--honey)">Market</span></a></div></header>

<section style="padding: 100px 0;">
  <div class="wrap" style="max-width: 900px; margin: 0 auto; padding: 0 20px;">
    <h1 style="font-family:'Cormorant Garamond',serif; font-size:3.5rem; margin-bottom:40px;">Mes <em>Favoris</em></h1>

    <div id="favView" style="display:none; display: flex; flex-direction: column; gap: 15px;">
      <div id="itemsContainer"></div>
    </div>

    <div id="emptyView" style="display:none; text-align:center; padding:80px 20px; background:var(--ink2); border-radius:16px; border:1px dashed var(--biscuit);">
      <div style="font-size:4rem; margin-bottom:20px; opacity:0.3; color: var(--honey)"><i class="far fa-heart"></i></div>
      <h2 style="font-family:'Cormorant Garamond',serif; font-size:2.5rem;">Aucun favori pour le moment</h2>
      <p style="color: var(--muted); margin-bottom: 20px;">Explorez notre catalogue et ajoutez des coups de cœur !</p>
      <a href="catalogue.html" id="expLink" style="display: inline-block; background: var(--honey); color: #111; text-decoration:none; font-size:1.1rem; padding: 12px 25px; border-radius: 50px; font-weight: 600;">Explorer le catalogue</a>
    </div>
  </div>
</section>

<!-- TOAST -->
<div class="toast" id="toast" style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:#1c0f07; color:#fff; padding:12px 25px; border-radius:50px; font-size:0.9rem; transition:all 0.4s ease; opacity:0; z-index:1000; border:1px solid var(--honey);">
  <i class="fas fa-check-circle" style="color:var(--honey); margin-right:8px;"></i><span id="tmsg"></span>
</div>

<script src="js/api-config.js"></script>
<script src="js/auth-system.js"></script>
<script>
function myToast(msg) {
  const t = document.getElementById('toast');
  const m = document.getElementById('tmsg');
  if(t && m) {
    m.textContent = msg;
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateX(-50%) translateY(100px)';
    }, 3000);
  } else {
    alert(msg);
  }
}

window.addLocalToCart = async function(encodedProd) {
  try {
    const prod = JSON.parse(decodeURIComponent(encodedProd));
    await GoldAuth.addToCart(prod);
    if (typeof updateCartBadges === 'function') updateCartBadges();
    
    // Retirer des favoris en même temps comme demandé
    GoldAuth.toggleFav(prod.id);
    const el = document.getElementById('fav-item-' + prod.id);
    if (el) el.remove();
    
    // Update view if empty
    if (GoldAuth.getFavs().length === 0) {
      document.getElementById('favView').style.display = 'none';
      document.getElementById('emptyView').style.display = 'block';
    }

    myToast('Ajouté au panier ! (Retiré des favoris)');
  } catch (err) {
    console.error("Panier error:", err);
  }
};

window.removeLocalFav = function(id) {
  try {
    GoldAuth.toggleFav(id);
    const el = document.getElementById('fav-item-' + id);
    if (el) el.remove();
    
    if (GoldAuth.getFavs().length === 0) {
      document.getElementById('favView').style.display = 'none';
      document.getElementById('emptyView').style.display = 'block';
    }
    myToast('Retiré des favoris');
  } catch (err) {
    console.error("Remove fav error:", err);
  }
};

async function refreshFavs() {
  const container = document.getElementById('itemsContainer');
  const favView = document.getElementById('favView');
  const emptyView = document.getElementById('emptyView');

  // Fix visitor catalog link
  document.getElementById('expLink').href = GoldAuth.isLoggedIn() ? 'catalogue.html' : 'catalogue-visiteur.html';

  let products = [];
  const user = GoldAuth.getUser();
  
  container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted);"><i class="fas fa-spinner fa-spin"></i> Chargement de vos articles...</div>';
  emptyView.style.display = 'none';
  favView.style.display = 'flex';

  try {
    if (user) {
      // Un utilisateur connecté (Acheteur ou Vendeur)
      const bId = user.id_user || user.id;
      const res = await fetch(`${API_BASE}/acheteurs/${bId}/favoris?_t=${Date.now()}`, { cache: 'no-store' });
      if (res.ok) {
        let rawData = await res.json();
        products = Array.isArray(rawData) ? rawData : (rawData.data || rawData.favorites || Object.values(rawData));
      } else {
        throw new Error("HTTP Erreur API favoris: " + res.status);
      }
    } else {
      // Visiteur: fetch all and filter by localStorage
      let favIds = GoldAuth.getFavs();
      if (favIds.length > 0) {
        const res = await fetch(`${API_BASE}/produits`);
        if (res.ok) {
          let allProducts = await res.json();
          let items = Array.isArray(allProducts) ? allProducts : (allProducts.data || Object.values(allProducts));
          products = items.filter(p => favIds.includes(String(p.id_produit)));
        }
      }
    }

    if (!products || products.length === 0) {
      favView.style.display = 'none';
      emptyView.style.display = 'block';
      return;
    }

    container.innerHTML = products.map((it) => {
      const idProd = it.id_produit || it.id;
      const p = parseFloat(it.prix_unitaire || it.prix || 0);
      const imgPath = it.photo ? (API_BASE.replace('/api','') + '/' + it.photo) : null;
      const titreProduit = it.titre || it.nom || 'Produit sans nom';
      const catProduit = it.categorie_nom || it.nom_categorie || 'Catégorie inconnue';
      
      // Fallback pour la description (important !)
      const descProduit = it.description ? (it.description.length > 90 ? it.description.substring(0,90) + '...' : it.description) : 'Aucune description fournie pour cet article.';

      // Encodage sans guillemets simples (100% bug-free)
      const prodJson = encodeURIComponent(JSON.stringify({
        id: idProd,
        name: titreProduit,
        price: p,
        image: imgPath,
        qty: 1
      })).replace(/'/g, "%27");

      return `
        <div class="fav-item" id="fav-item-${idProd}">
          <a href="product.html?id=${idProd}" class="product-link" style="flex-shrink:0;">
            <div class="fav-thumb">
              ${imgPath ? '<img src="' + imgPath + '">' : '<span style="color:#666"><i class="fas fa-image"></i></span>'}
            </div>
          </a>
          <div class="fav-details">
            <a href="product.html?id=${idProd}" class="product-link">
              <div style="color:var(--muted); font-size:0.8rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:5px;">\${catProduit}</div>
              <div style="font-size:1.4rem; font-weight:600; color:#fff; font-family:'Cormorant Garamond',serif; margin-bottom:4px;">\${titreProduit}</div>
              <div style="font-size:0.9rem; color:#aaa; line-height:1.4; margin-bottom:10px;">\${descProduit}</div>
            </a>
            <div class="fav-price">\${p.toFixed(2).replace('.',',')} €</div>
          </div>
          <div style="display:flex; flex-direction:column; gap:10px; justify-content:center;">
            <button class="btn-action btn-cart" onclick="window.addLocalToCart('\${prodJson}')"><i class="fas fa-shopping-bag"></i> Ajouter</button>
            <button class="btn-action btn-remove" onclick="window.removeLocalFav('\${idProd}')"><i class="fas fa-trash"></i> Retirer</button>
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    console.error(e);
    container.innerHTML = `<div style="background:var(--paprika); color:#fff; padding:15px; border-radius:8px; text-align:center;">
        <b>ERREUR LORS DU CHARGEMENT :</b><br>\${e.message}
      </div>`;
  }
}

window.removeLocalFav = function(idProd) {
    if (typeof GoldAuth !== 'undefined') {
        const isAddedUnused = GoldAuth.toggleFav(idProd);
    }
    
    const el = document.getElementById('fav-item-' + idProd);
    if (el) {
        el.style.transition = 'all 0.3s ease';
        el.style.opacity = '0';
        el.style.transform = 'scale(0.9)';
        setTimeout(() => {
            el.remove();
            const container = document.getElementById('favList');
            if (container && !container.querySelector('.fav-item')) {
                const fv = document.getElementById('favView');
                if (fv) fv.style.display = 'none';
                const ev = document.getElementById('emptyView');
                if (ev) ev.style.display = 'block';
            }
        }, 300);
    }
};

window.addLocalToCart = async function(jsonStr) {
    const item = JSON.parse(decodeURIComponent(jsonStr));
    if (typeof GoldAuth !== 'undefined') {
        await GoldAuth.addToCart(item);
        GoldAuth.toggleFav(item.id);
    }
    
    const el = document.getElementById('fav-item-' + item.id);
    if (el) {
        el.style.transition = 'all 0.3s ease';
        el.style.opacity = '0';
        el.style.transform = 'scale(0.9)';
        setTimeout(() => {
            el.remove();
            const container = document.getElementById('favList');
            if (container && !container.querySelector('.fav-item')) {
                const fv = document.getElementById('favView');
                if (fv) fv.style.display = 'none';
                const ev = document.getElementById('emptyView');
                if (ev) ev.style.display = 'block';
            }
        }, 300);
    }
};

async function initFavs() {
  if (GoldAuth.isLoggedIn()) {
    await GoldAuth.syncFavsFromServer();
  }
  refreshFavs();
}

window.onload = initFavs;
</script>
</body>
</html>
