<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Notifications — RetroMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/acheteur.css">
  <style>
    .notif-card {
      background: var(--ink2); border: 1px solid var(--biscuit);
      border-radius: 12px; padding: 20px; margin-bottom: 15px;
      display: flex; gap: 15px; align-items: flex-start;
    }
    .notif-card.unread {
      border-color: var(--honey);
      background: rgba(229,166,87,0.05);
    }
    .notif-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(229,166,87,0.2); color: var(--honey);
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
      flex-shrink: 0;
    }
    .notif-content { flex: 1; }
    .notif-msg { color: var(--ink); font-size: 1rem; margin-bottom: 5px; }
    .notif-date { color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <div id="navbar-container"></div>
  <div class="v-page-header">
    <div class="wrap">
      <h1 class="v-page-title">Mes <em>Notifications</em></h1>
      <p class="v-page-subtitle">Suivez l'état de vos commandes.</p>
    </div>
  </div>
  <main style="padding: 40px 0; min-height: 50vh;">
    <div class="wrap" id="notifs-container">
      <div style="text-align:center; padding:40px; color:var(--muted);"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
    </div>
  </main>
  <div id="footer-container"></div>
  
  <script src="js/acheteur.js"></script>
  <script>
    // Protection: Redirect if not logged in as buyer
    const u = JSON.parse(localStorage.getItem('gold_user') || 'null');
    if (!u || (u.role !== 'ACHETEUR' && u.role !== 'BOTH')) {
      window.location.href = '../authentification/sign-in.html';
    }

    document.getElementById('navbar-container').innerHTML = renderacheteurNavbar('notifications');
    document.getElementById('footer-container').innerHTML = renderacheteurFooter();

    async function loadNotifications() {
      if (!u) return; // Should be handled by protection above
      
      try {
        const res = await fetch(`${window.API_BASE}/notifications?user_id=${u.id}`);
        const notifs = await res.json();
        
        const container = document.getElementById('notifs-container');
        if (notifs.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted);">Vous n\'avez aucune notification.</div>';
          return;
        }

        // Update badge
        const unreadCount = notifs.filter(n => n.status === 'unread').length;
        const badge = document.querySelector('.v-notif-count');
        if(badge) {
          badge.textContent = unreadCount;
          badge.style.display = unreadCount > 0 ? 'flex' : 'none';
        }

        container.innerHTML = notifs.map(n => `
          <div class="notif-card ${n.status === 'unread' ? 'unread' : ''}">
            <div class="notif-icon"><i class="fas fa-bell"></i></div>
            <div class="notif-content">
              <div class="notif-msg">${n.message}</div>
              <div class="notif-date">${new Date(n.created_at).toLocaleString('fr-FR')}</div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('notifs-container').innerHTML = '<div style="text-align:center; padding:40px; color:var(--paprika);">Erreur lors du chargement des notifications.</div>';
      }
    }
    
    loadNotifications();
  </script>
</body>
</html>
