<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Commandes — Retro Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    :root {
      --crumpet: #1c1719;
      --ink: #f5e2ce;
      --ink2: #272124;
      --honey: #e5a657;
      --biscuit: #383033;
      --muted: rgba(245, 226, 206, 0.6);
      --success: #2ecc71;
      --warning: #f1c40f;
      --danger: #e74c3c;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--crumpet);
      color: var(--ink);
      margin: 0;
    }

    h1, h2, h3, h4, .logo { font-family: 'Cormorant Garamond', serif !important; }

    /* NAVBAR */
    .navbar {
      background: rgba(28, 23, 25, 0.95);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--biscuit);
      padding: 15px 0;
      position: fixed; width: 100%; top: 0; z-index: 1000;
    }
    .nav-wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.8rem; text-decoration: none; color: var(--ink); font-weight: 700; }
    .logo span { color: var(--honey); }

    /* HEADER */
    .page-header {
      padding-top: 140px; padding-bottom: 60px;
      text-align: center;
      background: linear-gradient(to bottom, rgba(28, 23, 25, 0.5), var(--crumpet));
    }
    .page-title { font-size: 3.5rem; margin-bottom: 10px; }
    .page-title em { color: var(--honey); font-style: italic; }

    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

    /* FILTERS */
    .order-filters {
      display: flex; gap: 10px; margin-bottom: 40px; justify-content: center; overflow-x: auto; padding-bottom: 10px;
    }
    .filter-btn {
      padding: 10px 20px; border-radius: 50px; border: 1px solid var(--biscuit);
      background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; transition: all 0.3s;
    }
    .filter-btn.active { background: var(--honey); color: #111; border-color: var(--honey); font-weight: 600; }

    /* ORDER CARD */
    .order-card {
      background: var(--ink2); border: 1px solid var(--biscuit); border-radius: 20px;
      margin-bottom: 25px; overflow: hidden; transition: transform 0.3s;
    }
    .order-card:hover { transform: translateY(-5px); border-color: var(--honey); }
    
    .oc-header {
      padding: 20px 30px; background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--biscuit);
      display: flex; justify-content: space-between; align-items: center;
    }
    .oc-id { font-weight: 600; font-size: 1.1rem; color: #fff; }
    .oc-date { font-size: 0.85rem; color: var(--muted); }
    
    .status-badge {
      padding: 6px 14px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
    }
    .status-pending { background: rgba(241, 196, 15, 0.1); color: var(--warning); }
    .status-confirmed { background: rgba(46, 204, 113, 0.1); color: var(--success); }
    .status-shipped { background: rgba(52, 152, 219, 0.1); color: #3498db; }
    .status-delivered { background: rgba(46, 204, 113, 0.2); color: var(--success); }
    .status-cancelled { background: rgba(231, 76, 60, 0.1); color: var(--danger); }

    .oc-body { padding: 30px; }
    .order-item { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
    .order-item:last-child { margin-bottom: 0; }
    .item-thumb { width: 60px; height: 60px; background: var(--biscuit); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; overflow:hidden; }
    .item-thumb img { width:100%; height:100%; object-fit:cover; }
    .item-info { flex: 1; }
    .item-name { font-weight: 600; color: #fff; margin-bottom: 4px; }
    .item-meta { font-size: 0.8rem; color: var(--muted); }
    .item-price { font-weight: 600; color: var(--honey); font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; }

    .oc-footer {
      padding: 20px 30px; border-top: 1px dashed var(--biscuit);
      display: flex; justify-content: space-between; align-items: center;
    }
    .total-label { color: var(--muted); font-size: 0.9rem; }
    .total-val { font-size: 1.8rem; font-weight: 700; color: var(--honey); font-family: 'Cormorant Garamond', serif; }

    .btn-details {
      padding: 10px 25px; border-radius: 50px; background: transparent; border: 1px solid var(--biscuit);
      color: var(--ink); text-decoration: none; font-size: 0.9rem; transition: all 0.3s;
    }
    .btn-details:hover { border-color: var(--honey); color: var(--honey); }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 100px 20px; }
    .empty-icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.2; }
    .empty-title { font-size: 2rem; margin-bottom: 15px; }
    .btn-explore { display: inline-block; margin-top: 20px; padding: 15px 40px; background: var(--honey); color: #111; border-radius: 50px; text-decoration: none; font-weight: 700; }

    .loader { text-align: center; padding: 100px; color: var(--honey); }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-wrap">
      <a href="../index.html" class="logo">Retro<span>Market</span></a>
      <div id="nav-actions">
        <a href="profile.html" style="color:var(--ink); text-decoration:none;"><i class="fas fa-user-circle"></i> Mon Espace</a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="wrap">
        <h1 class="page-title">Mes <em>Commandes</em></h1>
        <p style="color:var(--muted)">Historique complet de vos acquisitions musicales.</p>
      </div>
    </section>

    <div class="wrap">
      <div class="order-filters" id="statusFilters">
        <button class="filter-btn active" data-filter="all">Toutes</button>
        <button class="filter-btn" data-filter="en_attente">En attente</button>
        <button class="filter-btn" data-filter="confirmee">Confirmées</button>
        <button class="filter-btn" data-filter="expediee">Expédiées</button>
        <button class="filter-btn" data-filter="livree">Livrées</button>
      </div>

      <div id="ordersContainer">
        <div class="loader"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
      </div>
    </div>
  </main>

  <script src="../js/api-config.js"></script>
  <script src="../js/auth-system.js"></script>
  <script>
    const STATUS_MAP = {
      'en_attente': { label: 'En attente', class: 'status-pending', icon: 'fa-clock' },
      'confirmee': { label: 'Confirmée', class: 'status-confirmed', icon: 'fa-check-circle' },
      'expediee': { label: 'Expédiée', class: 'status-shipped', icon: 'fa-truck' },
      'livree': { label: 'Livrée', class: 'status-delivered', icon: 'fa-check-double' },
      'annulee': { label: 'Annulée', class: 'status-cancelled', icon: 'fa-times' }
    };

    let allOrders = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const user = GoldAuth.getUser();
      if (!user) { window.location.href = '../authentification/sign-in.html'; return; }

      await loadOrders(user.id_user || user.id);
      setupFilters();
    });

    async function loadOrders(uid) {
      try {
        const res = await fetch(`${API_BASE}/acheteurs/${uid}/commandes`);
        if (res.ok) {
          allOrders = await res.json();
          renderOrders(allOrders);
        } else {
          renderEmpty();
        }
      } catch (e) {
        console.error(e);
        renderEmpty();
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById('ordersContainer');
      if (orders.length === 0) { renderEmpty(); return; }

      container.innerHTML = orders.map(order => {
        const status = STATUS_MAP[order.statut] || STATUS_MAP['en_attente'];
        const date = new Date(order.date_commande).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
        
        return `
          <div class="order-card">
            <div class="oc-header">
              <div>
                <div class="oc-id">Commande #${order.numero}</div>
                <div class="oc-date">Le ${date}</div>
              </div>
              <div class="status-badge ${status.class}">
                <i class="fas ${status.icon}"></i> ${status.label}
              </div>
            </div>
            <div class="oc-body">
              ${order.produits.map(item => {
                const img = item.photo ? (API_BASE.replace('/api','') + '/' + item.photo) : null;
                return `
                <div class="order-item">
                  <div class="item-thumb">
                    ${img ? `<img src="${img}" alt="${item.name}">` : '🎵'}
                  </div>
                  <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <div class="item-meta">Quantité : ${item.qty || item.quantite}</div>
                  </div>
                  <div class="item-price">${(item.price || item.prix).toFixed(2)} €</div>
                </div>
                `;
              }).join('')}
            </div>
            <div class="oc-footer">
              <div>
                <span class="total-label">Montant Total</span>
                <div class="total-val">${order.total.toFixed(2)} €</div>
              </div>
              <a href="order-details.html?id=${order.id}" class="btn-details">Voir les détails</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderEmpty() {
      document.getElementById('ordersContainer').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📦</div>
          <h2 class="empty-title">Aucune commande</h2>
          <p style="color:var(--muted)">Vous n'avez pas encore passé de commande sur Retro Market.</p>
          <a href="../catalogue.html" class="btn-explore">Parcourir le catalogue</a>
        </div>
      `;
    }

    function setupFilters() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const filter = btn.dataset.filter;
          const filtered = filter === 'all' ? allOrders : allOrders.filter(o => o.statut === filter);
          renderOrders(filtered);
        });
      });
    }
  </script>
</body>
</html>
