<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement Sécurisé — RetroMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/acheteur.css">
  <style>
    .payment-container { max-width: 500px; margin: 60px auto; padding: 30px; background: var(--ink2); border: 1px solid var(--biscuit); border-radius: 16px; }
    .payment-header { text-align: center; margin-bottom: 30px; }
    .payment-header i { font-size: 3rem; color: var(--honey); margin-bottom: 15px; }
    .payment-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: var(--ink); }
    
    .card-display {
      background: linear-gradient(135deg, #1c1719 0%, #2d2428 100%);
      border: 1px solid rgba(245,226,206,0.1); border-radius: 12px;
      padding: 25px; margin-bottom: 30px; position: relative; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .card-display::after { content: ''; position: absolute; top: -50%; right: -20%; width: 200px; height: 200px; background: var(--honey); opacity: 0.05; border-radius: 50%; }
    .card-chip { width: 45px; height: 35px; background: linear-gradient(135deg, #e5a657 0%, #c07d30 100%); border-radius: 6px; margin-bottom: 25px; }
    .card-number-display { font-family: 'Courier New', Courier, monospace; font-size: 1.4rem; color: #fff; letter-spacing: 2px; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
    .card-holder-display { font-size: 0.75rem; text-transform: uppercase; color: rgba(245,226,206,0.6); letter-spacing: 1px; }
    .card-expiry-display { font-size: 0.75rem; color: rgba(245,226,206,0.6); }

    .payment-form .form-group { margin-bottom: 18px; }
    .payment-form label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .payment-form input { width: 100%; padding: 12px 15px; border: 1px solid var(--biscuit); border-radius: 8px; background: rgba(245,226,206,0.05); color: var(--ink); font-family: 'Outfit', sans-serif; outline: none; }
    .payment-form input:focus { border-color: var(--honey); }
    
    .summary-box { padding: 15px; background: rgba(229,166,87,0.05); border-radius: 8px; margin-bottom: 25px; border: 1px dashed rgba(229,166,87,0.2); }
    .summary-row { display: flex; justify-content: space-between; font-size: 0.9rem; }
    .summary-total { font-weight: 700; color: var(--honey); font-size: 1.1rem; margin-top: 5px; }
  </style>
</head>
<body>
  <div id="navbar-container"></div>
  
  <main class="wrap">
    <div class="payment-container">
      <div class="payment-header">
        <i class="fas fa-shield-alt"></i>
        <h2>Paiement Sécurisé</h2>
        <p style="color:var(--muted); font-size:0.9rem; margin-top:5px;">Transaction cryptée SSL 256-bits</p>
      </div>

      <div class="card-display">
        <div class="card-chip"></div>
        <div class="card-number-display" id="disp-card-num">•••• •••• •••• ••••</div>
        <div class="card-bottom">
          <div>
            <div style="font-size: 0.6rem; color: rgba(245,226,206,0.4); margin-bottom: 2px;">TITULAIRE</div>
            <div class="card-holder-display" id="disp-card-name">NOM PRÉNOM</div>
          </div>
          <div>
            <div style="font-size: 0.6rem; color: rgba(245,226,206,0.4); margin-bottom: 2px;">EXPIRE</div>
            <div class="card-expiry-display" id="disp-card-expiry">MM/AA</div>
          </div>
        </div>
      </div>

      <div class="summary-box">
        <div class="summary-row">
          <span>Total à régler</span>
          <span class="summary-total" id="orderTotal">0.00 €</span>
        </div>
      </div>

      <form class="payment-form" id="paymentForm">
        <div class="form-group">
          <label>Numéro de carte</label>
          <input type="text" id="cardNum" placeholder="0000 0000 0000 0000" maxlength="19" required>
        </div>
        <div class="form-group">
          <label>Nom sur la carte</label>
          <input type="text" id="cardName" placeholder="NOM PRÉNOM" required>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
          <div class="form-group">
            <label>Date d'expiration</label>
            <input type="text" id="cardExpiry" placeholder="MM/AA" maxlength="5" required>
          </div>
          <div class="form-group">
            <label>CVV</label>
            <input type="password" id="cardCvv" placeholder="***" maxlength="3" required>
          </div>
        </div>
        <button type="submit" class="v-btn v-btn-primary" style="width:100%; justify-content:center; margin-top:10px; padding: 15px;" id="payBtn">
          <i class="fas fa-lock"></i> Valider le paiement
        </button>
      </form>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="js/acheteur.js"></script>
  <script>
    // Protection
    const u = JSON.parse(localStorage.getItem('gold_user') || 'null');
    if (!u) window.location.href = '../authentification/sign-in.html';

    document.getElementById('navbar-container').innerHTML = renderacheteurNavbar('');
    document.getElementById('footer-container').innerHTML = renderacheteurFooter();

    const shipping = JSON.parse(localStorage.getItem('pending_order_shipping') || 'null');
    const cart = acheteurSystem.getCart();
    const total = cart.reduce((s, i) => s + parseFloat(i.price) * (i.qty || 1), 0);

    if (!shipping || cart.length === 0) {
      window.location.href = 'panier.html';
    }

    document.getElementById('orderTotal').textContent = total.toLocaleString('fr-FR', {minimumFractionDigits:2}) + ' €';

    // Live Card Update
    document.getElementById('cardNum').addEventListener('input', e => {
      let v = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
      let matches = v.match(/\d{4,16}/g);
      let match = matches && matches[0] || '';
      let parts = [];
      for (i=0, len=match.length; i<len; i+=4) { parts.push(match.substring(i, i+4)); }
      if (parts.length) e.target.value = parts.join(' ');
      document.getElementById('disp-card-num').textContent = e.target.value || '•••• •••• •••• ••••';
    });
    document.getElementById('cardName').addEventListener('input', e => {
      document.getElementById('disp-card-name').textContent = e.target.value.toUpperCase() || 'NOM PRÉNOM';
    });
    document.getElementById('cardExpiry').addEventListener('input', e => {
      let v = e.target.value.replace(/[^0-9]/gi, '');
      if (v.length > 2) v = v.substring(0,2) + '/' + v.substring(2,4);
      e.target.value = v;
      document.getElementById('disp-card-expiry').textContent = v || 'MM/AA';
    });

    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('payBtn');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Traitement en cours...';
      btn.disabled = true;

      const payload = {
        user_id: u.id_user || u.id,
        total_price: total,
        phone: shipping.phone,
        address: shipping.address,
        items: cart.map(item => ({
          product_id: parseInt(item.id),
          quantity: item.qty || 1,
          price: parseFloat(item.price)
        }))
      };

      try {
        // Simulation delay
        await new Promise(r => setTimeout(r, 2000));

        const res = await fetch(`${window.API_BASE}/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          acheteurSystem.clearCart();
          localStorage.removeItem('pending_order_shipping');
          acheteurSystem.logActivity('order_placed', `Commande de ${total.toFixed(2)}€ validée`);
          acheteurToast.show('Paiement accepté ! Votre commande est en route.');
          setTimeout(() => window.location.href = 'commandes.html', 2000);
        } else {
          const data = await res.json();
          acheteurToast.show(data.message || 'Erreur lors de la validation', 'error');
          btn.innerHTML = '<i class="fas fa-lock"></i> Valider le paiement';
          btn.disabled = false;
        }
      } catch (err) {
        acheteurToast.show('Erreur de connexion', 'error');
        btn.innerHTML = '<i class="fas fa-lock"></i> Valider le paiement';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
