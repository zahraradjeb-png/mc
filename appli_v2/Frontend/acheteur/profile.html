<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Profil — RetroMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/acheteur.css">
  <style>
    .profile-card {
      background: var(--ink2); border: 1px solid var(--biscuit);
      border-radius: 12px; padding: 30px; margin-bottom: 20px;
    }
    .profile-header {
      display: flex; align-items: center; gap: 20px; border-bottom: 1px solid var(--biscuit); padding-bottom: 20px; margin-bottom: 20px;
    }
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%; background: var(--honey); color: #111;
      display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold;
    }
    .profile-name { font-size: 1.5rem; font-weight: 600; color: var(--ink); }
    .profile-email { color: var(--muted); font-size: 1rem; }
    .profile-section-title { font-size: 1.2rem; color: var(--ink); margin-bottom: 15px; border-bottom: 1px dashed var(--biscuit); padding-bottom: 5px; }
  </style>
</head>
<body>
  <div id="navbar-container"></div>
  <div class="v-page-header">
    <div class="wrap">
      <h1 class="v-page-title">Mon <em>Profil</em></h1>
      <p class="v-page-subtitle">Gérez vos informations personnelles.</p>
    </div>
  </div>
  <main style="padding: 60px 0 80px;">
    <div class="wrap" id="profile-container">
      <div style="text-align:center; padding:40px; color:var(--muted);"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
    </div>
  </main>
  <div id="footer-container"></div>
  <script src="js/acheteur.js"></script>
  <script src="../js/auth-system.js"></script>
  <script>
    // Protection
    const u = JSON.parse(localStorage.getItem('gold_user') || 'null');
    if (!u || (u.role !== 'ACHETEUR' && u.role !== 'BOTH')) {
      window.location.href = '../authentification/sign-in.html';
    }

    document.getElementById('navbar-container').innerHTML = renderacheteurNavbar('profile');
    document.getElementById('footer-container').innerHTML = renderacheteurFooter();
    
    if (u) {
      document.getElementById('profile-container').innerHTML = `
        <div class="profile-card">
          <div class="profile-header">
            <div class="profile-avatar">${u.prenom ? u.prenom.charAt(0).toUpperCase() : 'U'}</div>
            <div>
              <div class="profile-name">${u.prenom || ''} ${u.nom || 'Utilisateur'}</div>
              <div class="profile-email">${u.email || 'Non spécifié'}</div>
            </div>
          </div>
          
          <div class="profile-section-title">Informations Personnelles</div>
          <p style="color:var(--muted); margin-bottom: 10px;"><strong>Rôle :</strong> ${u.role || 'ACHETEUR'}</p>
          
          <div class="profile-section-title" style="margin-top:20px;">Accès Rapides</div>
          <div style="display:flex; gap:15px; margin-bottom: 25px; flex-wrap:wrap;">
            <a href="commandes.html" class="v-btn v-btn-secondary"><i class="fas fa-box"></i> Historique des commandes</a>
            <a href="favoris.html" class="v-btn v-btn-secondary"><i class="fas fa-heart"></i> Mes favoris</a>
          </div>
          
          <div style="border-top:1px solid var(--biscuit); padding-top:20px; margin-top:20px;">
            <button onclick="handleLogout()" class="v-btn" style="background:var(--paprika); color:#fff; border:none;">
              <i class="fas fa-sign-out-alt"></i> Se déconnecter
            </button>
          </div>
        </div>

        <div class="profile-card">
          <h3 class="profile-section-title"><i class="fas fa-history" style="color:var(--honey); margin-right:10px;"></i> Historique d'activité</h3>
          <div id="activity-list">
            <div style="text-align:center; padding:20px; color:var(--muted);"><i class="fas fa-spinner fa-spin"></i> Chargement de l'activité...</div>
          </div>
        </div>
      `;
      loadActivities();
    }

    async function loadActivities() {
      try {
        const userId = u.id_user || u.id;
        const res = await fetch(`${window.API_BASE}/activities?user_id=${userId}`);
        const data = await res.json();
        const list = document.getElementById('activity-list');
        
        if (!data || data.length === 0) {
          list.innerHTML = '<p style="color:var(--muted); font-size:0.9rem;">Aucune activité récente.</p>';
          return;
        }

        list.innerHTML = data.map(act => `
          <div style="padding:12px; border-bottom:1px solid rgba(245,226,206,0.05); display:flex; gap:15px; align-items:center;">
            <div style="width:36px; height:36px; border-radius:50%; background:rgba(229,166,87,0.1); display:flex; align-items:center; justify-content:center; color:var(--honey);">
              <i class="fas ${getActivityIcon(act.type)}"></i>
            </div>
            <div style="flex:1;">
              <div style="font-size:0.9rem; color:var(--ink);">${act.description}</div>
              <div style="font-size:0.75rem; color:var(--muted);">${new Date(act.date).toLocaleString('fr-FR')}</div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('activity-list').innerHTML = '<p style="color:var(--paprika); font-size:0.85rem;">Erreur de chargement de l\'activité.</p>';
      }
    }

    function getActivityIcon(type) {
      if (type.includes('order')) return 'fa-shopping-bag';
      if (type.includes('review')) return 'fa-star';
      if (type.includes('cart')) return 'fa-shopping-cart';
      if (type.includes('fav')) return 'fa-heart';
      return 'fa-bolt';
    }

    function handleLogout() {
      if (typeof GoldAuth !== 'undefined') {
        GoldAuth.logout();
      } else {
        localStorage.removeItem('gold_user');
        localStorage.removeItem('gold_token');
      }
      window.location.href = '../visitor/index.html';
    }
  </script>
</body>
</html>
