<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Panier — RetroMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/acheteur.css">
  <style>
    .v-cart-layout { display: grid; grid-template-columns: 1fr 360px; gap: 32px; padding: 40px 0 80px; align-items: start; }
    .v-cart-item {
      display: flex; gap: 20px; padding: 20px;
      background: var(--ink2); border: 1px solid var(--biscuit);
      border-radius: 12px; margin-bottom: 16px;
      transition: all 0.3s;
    }
    .v-cart-item:hover { border-color: rgba(229,166,87,0.2); }
    .v-cart-img {
      width: 100px; height: 100px; border-radius: 10px;
      background: var(--biscuit); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; overflow: hidden;
    }
    .v-cart-img img { width: 100%; height: 100%; object-fit: cover; }
    .v-cart-details { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .v-cart-name { font-size: 1.1rem; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .v-cart-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
    .v-cart-price { font-size: 1.1rem; font-weight: 700; color: var(--honey); }
    .v-cart-remove {
      align-self: flex-start; width: 36px; height: 36px;
      border-radius: 8px; border: 1px solid var(--biscuit);
      background: transparent; color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s; flex-shrink: 0;
    }
    .v-cart-remove:hover { border-color: var(--paprika); color: var(--paprika); background: rgba(181,51,36,0.1); }

    .v-cart-summary {
      background: var(--ink2); border: 1px solid var(--biscuit);
      border-radius: 14px; padding: 28px; position: sticky; top: 100px;
    }
    .v-cart-summary h3 { font-size: 1.3rem; color: var(--ink); margin-bottom: 20px; border-bottom: 1px solid var(--biscuit); padding-bottom: 14px; }
    .v-cart-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; color: var(--muted); }
    .v-cart-total { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--biscuit); font-size: 1.2rem; font-weight: 700; color: var(--ink); }
    .v-cart-total span:last-child { color: var(--honey); }

    .v-checkout-blocked {
      margin-top: 24px; padding: 18px; border-radius: 10px;
      background: rgba(181,51,36,0.08); border: 1px solid rgba(181,51,36,0.2);
      text-align: center;
    }
    .v-checkout-blocked i { color: var(--paprika); font-size: 1.2rem; margin-bottom: 8px; display: block; }
    .v-checkout-blocked p { color: var(--muted); font-size: 0.88rem; margin-bottom: 14px; }

    @media (max-width: 900px) { .v-cart-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="navbar-container"></div>
  <div class="v-page-header">
    <div class="wrap">
      <h1 class="v-page-title">Mon <em>Panier</em></h1>
      <p class="v-page-subtitle">Gérez vos articles avant de passer commande.</p>
    </div>
  </div>
  <main>
    <div class="wrap">
      <div class="v-cart-layout">
        <div id="cartItems"></div>
        <div class="v-cart-summary" id="cartSummary"></div>
      </div>
    </div>
  </main>
  <div id="footer-container"></div>
  <script src="js/acheteur.js"></script>
  <script>
    // Protection: Redirect if not logged in as buyer
    const u = JSON.parse(localStorage.getItem('gold_user') || 'null');
    if (!u || (u.role !== 'ACHETEUR' && u.role !== 'BOTH')) {
      window.location.href = '../authentification/sign-in.html';
    }

    document.getElementById('navbar-container').innerHTML = renderacheteurNavbar('panier');
    document.getElementById('footer-container').innerHTML = renderacheteurFooter();

    function renderCart() {
      const cart = acheteurSystem.getCart();
      const items = document.getElementById('cartItems');
      const summary = document.getElementById('cartSummary');

      if (cart.length === 0) {
        items.innerHTML = `<div class="v-empty"><i class="fas fa-shopping-bag"></i><h3>Votre panier est vide</h3><p>Explorez notre catalogue pour trouver des trésors vintage.</p><a href="catalogue.html" class="v-btn v-btn-primary v-btn-sm">Explorer le catalogue</a></div>`;
        summary.style.display = 'none';
        return;
      }
      summary.style.display = 'block';

      const emojis = { 'VINYLE': '🎵', 'CASSETTE': '📼', 'INSTRUMENT': '🎸', 'POSTER': '🖼️', 'CD': '💿' };
      items.innerHTML = cart.map(item => `
        <div class="v-cart-item" data-id="${item.id}">
          <div class="v-cart-img">
            ${item.image ? `<img src="${item.image}" alt="${item.name}" onerror="this.style.display='none';this.parentElement.textContent='🎵'">` : '🎵'}
          </div>
          <div class="v-cart-details">
            <div class="v-cart-name">${item.name}</div>
            <div class="v-cart-meta">${item.meta || 'Article vintage'}</div>
            <div class="v-cart-price">${parseFloat(item.price).toLocaleString('fr-FR', {minimumFractionDigits:2})} €</div>
          </div>
          <button class="v-cart-remove" onclick="removeItem('${item.id}')" title="Retirer"><i class="fas fa-trash-alt"></i></button>
        </div>`).join('');

      const subtotal = cart.reduce((s, i) => s + parseFloat(i.price) * (i.qty || 1), 0);
      summary.innerHTML = `
        <h3>Résumé</h3>
        <div class="v-cart-row"><span>Sous-total (${cart.length} article${cart.length>1?'s':''})</span><span>${subtotal.toLocaleString('fr-FR',{minimumFractionDigits:2})} €</span></div>
        <div class="v-cart-row"><span>Livraison</span><span style="color:var(--honey)">Gratuite</span></div>
        <div class="v-cart-total"><span>Total</span><span>${subtotal.toLocaleString('fr-FR',{minimumFractionDigits:2})} €</span></div>
        <div id="checkoutForm" style="margin-top:20px;">
          <h4 style="margin-bottom:10px; color:var(--ink);">Informations de livraison</h4>
          <input type="text" id="orderPhone" placeholder="Téléphone (obligatoire)" style="width:100%; padding:10px; margin-bottom:10px; border-radius:6px; border:1px solid var(--biscuit); background:var(--ink2); color:var(--ink);">
          <input type="text" id="orderAddress" placeholder="Adresse complète (obligatoire)" style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:1px solid var(--biscuit); background:var(--ink2); color:var(--ink);">
          <button onclick="goToPayment()" class="v-btn v-btn-primary" style="width:100%; justify-content:center;">Procéder au paiement</button>
        </div>`;
    }

    function goToPayment() {
      const user = JSON.parse(localStorage.getItem('gold_user'));
      if (!user) {
        showLoginRequired('passer commande');
        return;
      }

      const phone = document.getElementById('orderPhone').value.trim();
      const address = document.getElementById('orderAddress').value.trim();

      if (!phone || !address) {
        acheteurToast.show('Veuillez remplir tous les champs de livraison', 'error');
        return;
      }

      const cart = acheteurSystem.getCart();
      if (cart.length === 0) return;

      // Temporary store shipping info
      localStorage.setItem('pending_order_shipping', JSON.stringify({ phone, address }));
      
      // Log activity
      acheteurSystem.logActivity('checkout_start', `Début du paiement pour ${cart.length} articles`);

      window.location.href = 'payment.html';
    }

    function removeItem(id) {
      acheteurSystem.removeFromCart(id);
      renderCart();
    }

    renderCart();
  </script>
</body>
</html>
