<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscription — Retro Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,700&family=Outfit:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg-deep:   #0d090f;
      --accent-1:  #e5a657; /* Amber/Honey */
      --accent-2:  #b53324; /* Rust/Crimson */
      --glass:     rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f5e2ce;
      --ease:      cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-deep); color: var(--text-main); }
    body { font-family: 'Outfit', sans-serif; display: flex; }

    /* ── Blobs ── */
    .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; filter: blur(80px); opacity: 0.3; }
    .blob { position: absolute; border-radius: 50%; background: var(--accent-1); }
    .blob-1 { width: 400px; height: 400px; top: -100px; left: -100px; animation: float 20s infinite alternate; }
    .blob-2 { width: 300px; height: 300px; bottom: -50px; right: 10%; background: var(--accent-2); animation: float 15s infinite alternate-reverse; }
    @keyframes float { from { transform: translate(0,0); } to { transform: translate(50px, 80px); } }

    /* ══ LEFT STAGE ══ */
    .left-stage { flex: 0 0 50%; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; z-index: 1; }
    .assembly { position: relative; width: 600px; height: 460px; transition: transform 1.2s var(--ease); }
    .sleeve { position: absolute; left: 0; top: 0; width: 460px; height: 460px; border-radius: 8px; overflow: hidden; z-index: 10; box-shadow: -20px 30px 100px rgba(0,0,0,0.8); background: #111; animation: sleeveIn 1.2s var(--ease) both; }
    @keyframes sleeveIn { from { transform: translateX(100vw) rotate(10deg); opacity: 0; } to { transform: none; opacity: 1; } }
    .sleeve-cover { height: 100%; width: 100%; position: relative; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.9)), url('../assets/images/hero/first.jpg') center/cover; display: flex; flex-direction: column; justify-content: flex-end; padding: 40px; border: 1px solid rgba(255,255,255,0.05); }
    .sleeve-brand { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; line-height: 0.9; letter-spacing: 2px; color: #fff; }
    .sleeve-brand span { color: var(--accent-1); }
    .sleeve-tag { font-size: 0.7rem; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 5px; }

    .vinyl-wrap { position: absolute; right: -40px; top: 50%; width: 440px; height: 440px; transform: translateY(-50%) translateX(100px); z-index: 5; opacity: 0; transition: all 1.2s var(--ease); }
    .vinyl-disc { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, #222 0%, #000 70%); box-shadow: inset 0 0 60px rgba(255,255,255,0.05), -15px 15px 50px rgba(0,0,0,0.9); position: relative; display: flex; align-items: center; justify-content: center; }
    .vinyl-label { width: 30%; height: 30%; border-radius: 50%; background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .spin { animation: spin 20s linear infinite; }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

    /* ══ RIGHT PANEL ══ */
    .right-panel { flex: 0 0 50%; height: 100vh; background: rgba(13, 9, 15, 0.85); backdrop-filter: blur(40px); border-left: 1px solid var(--glass-border); display: flex; flex-direction: column; padding: 40px 60px; z-index: 10; opacity: 0; transform: translateX(50px); transition: all 0.8s var(--ease) 0.5s; overflow-y: auto; }
    .right-panel.show { opacity: 1; transform: translateX(0); }

    .rp-header { margin-bottom: 30px; }
    .rp-tag { display: inline-block; font-size: 0.6rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-1); background: rgba(229,166,87,0.1); padding: 4px 12px; border-radius: 50px; margin-bottom: 12px; }
    .rp-title { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 700; color: #fff; line-height: 1.1; }
    .rp-title em { font-style: italic; color: var(--accent-1); }

    /* Role Toggle */
    .role-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    .role-btn { background: var(--glass); border: 1px solid var(--glass-border); padding: 15px; border-radius: 12px; cursor: pointer; transition: all 0.3s; text-align: center; }
    .role-btn i { display: block; font-size: 1.2rem; margin-bottom: 5px; color: rgba(255,255,255,0.3); }
    .role-btn span { font-size: 0.85rem; font-weight: 700; color: rgba(255,255,255,0.5); }
    .role-btn.active { border-color: var(--accent-1); background: rgba(229,166,87,0.1); }
    .role-btn.active i { color: var(--accent-1); }
    .role-btn.active span { color: #fff; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-group { margin-bottom: 18px; position: relative; }
    .full-width { grid-column: span 2; }
    .form-label { display: block; font-size: 0.7rem; font-weight: 600; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }
    .rp-input { width: 100%; padding: 14px 16px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; font-family: 'Outfit', sans-serif; outline: none; transition: all 0.3s; font-size: 0.9rem; }
    .rp-input:focus { border-color: var(--accent-1); background: rgba(255,255,255,0.06); }

    .seller-fields { display: none; padding-top: 15px; border-top: 1px solid var(--glass-border); margin-top: 10px; }
    .seller-fields.show { display: block; }

    .rp-submit { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--accent-1), #c07d30); border: none; border-radius: 12px; color: #111; font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; transition: all 0.3s; margin-top: 10px; box-shadow: 0 10px 30px rgba(229,166,87,0.2); }
    .rp-submit:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(229,166,87,0.3); }

    .rp-footer { margin-top: 25px; text-align: center; font-size: 0.85rem; color: rgba(255,255,255,0.4); }
    .rp-footer a { color: var(--accent-1); text-decoration: none; font-weight: 600; }

    .back-btn { position: absolute; top: 40px; right: 40px; color: rgba(255,255,255,0.3); text-decoration: none; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; transition: color 0.3s; z-index: 100; }
    .back-btn:hover { color: var(--accent-1); }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1a1a1a; color: #fff; padding: 12px 25px; border-radius: 50px; font-size: 0.9rem; transition: all 0.4s var(--ease); opacity: 0; z-index: 1000; border: 1px solid var(--accent-1); }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .success-overlay { position: absolute; inset: 0; background: var(--bg-deep); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.5s; text-align: center; padding: 40px; }
    .success-overlay.show { opacity: 1; pointer-events: all; }
    .success-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--accent-1); color: #111; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin-bottom: 20px; }

    @media (max-width: 1100px) { body { flex-direction: column; overflow-y: auto; } .left-stage { flex: 0 0 40vh; } .right-panel { flex: none; width: 100%; height: auto; padding: 40px 30px; } .assembly { transform: scale(0.6); } }
  </style>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <a href="../auth-entry.html" class="back-btn"><i class="fas fa-arrow-left"></i> Retour</a>

  <div class="left-stage">
    <div class="assembly" id="assembly">
      <div class="sleeve">
        <div class="sleeve-cover">
          <div class="sleeve-tag">New Member</div>
          <div class="sleeve-brand">Retro<span> Market</span></div>
        </div>
      </div>
      <div class="vinyl-wrap" id="vinylWrap">
        <div class="vinyl-disc spin">
          <div class="vinyl-label"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="right-panel" id="rightPanel">
    <div class="rp-header">
      <div class="rp-tag">✦ Inscription</div>
      <h1 class="rp-title">Créer <em>mon compte</em></h1>
    </div>

    <div class="role-toggle">
      <div class="role-btn active" id="roleBuyer" onclick="setRole('ACHETEUR')">
        <i class="fas fa-shopping-cart"></i>
        <span>Acheteur</span>
      </div>
      <div class="role-btn" id="roleSeller" onclick="setRole('VENDEUR')">
        <i class="fas fa-store"></i>
        <span>Vendeur</span>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Prénom</label>
        <input type="text" id="firstName" class="rp-input" placeholder="Jean">
      </div>
      <div class="form-group">
        <label class="form-label">Nom</label>
        <input type="text" id="lastName" class="rp-input" placeholder="Dupont">
      </div>
      <div class="form-group full-width">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="rp-input" placeholder="votre@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" id="password" class="rp-input" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label class="form-label">Confirmer</label>
        <input type="password" id="confirmPassword" class="rp-input" placeholder="••••••••">
      </div>

      <!-- Seller Fields -->
      <div class="seller-fields full-width" id="sellerFields">
        <div class="form-group">
          <label class="form-label">Nom de la boutique</label>
          <input type="text" id="shopName" class="rp-input" placeholder="Ma Super Boutique">
        </div>
        <div class="form-group">
          <label class="form-label">Localisation</label>
          <input type="text" id="location" class="rp-input" placeholder="Paris, France">
        </div>
      </div>

      <div class="form-group full-width">
        <label style="display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: rgba(255,255,255,0.4); cursor: pointer;">
          <input type="checkbox" id="terms" style="accent-color: var(--accent-1);">
          J'accepte les conditions d'utilisation
        </label>
      </div>

      <button class="rp-submit full-width" id="registerBtn">Créer mon compte</button>
    </div>

    <div class="rp-footer">
      Déjà un compte ? <a href="sign-in.html">Se connecter</a>
    </div>

    <div class="success-overlay" id="successOverlay">
      <div class="success-icon"><i class="fas fa-check"></i></div>
      <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; margin-bottom: 10px;">Compte créé !</h2>
      <p style="color: rgba(255,255,255,0.5);">Bienvenue chez Retro Market.<br>Redirection en cours...</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/api-config.js"></script>
  <script>
    let currentRole = 'ACHETEUR';

    window.onload = () => {
      const assembly = document.getElementById('assembly');
      const vinylWrap = document.getElementById('vinylWrap');
      const rightPanel = document.getElementById('rightPanel');

      setTimeout(() => {
        assembly.style.transform = 'translateX(-80px)';
        vinylWrap.style.opacity = '1';
        vinylWrap.style.transform = 'translateY(-50%) translateX(220px)';
      }, 500);

      setTimeout(() => {
        rightPanel.classList.add('show');
      }, 1000);

      // Check URL for mode
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('mode') === 'seller') setRole('VENDEUR');
    };

    function setRole(role) {
      currentRole = role;
      document.getElementById('roleBuyer').classList.toggle('active', role === 'ACHETEUR');
      document.getElementById('roleSeller').classList.toggle('active', role === 'VENDEUR');
      document.getElementById('sellerFields').classList.toggle('show', role === 'VENDEUR');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    document.getElementById('registerBtn').addEventListener('click', async () => {
      const btn = document.getElementById('registerBtn');
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      const terms = document.getElementById('terms').checked;

      if (!firstName || !lastName || !email || !password || !confirm) { showToast('Remplissez tous les champs'); return; }
      if (password !== confirm) { showToast('Les mots de passe diffèrent'); return; }
      if (!terms) { showToast('Acceptez les conditions'); return; }

      const payload = {
        nom: lastName,
        prenom: firstName,
        email: email,
        mdp: password,
        role: currentRole
      };

      if (currentRole === 'VENDEUR') {
        payload.nom_boutique = document.getElementById('shopName').value;
        payload.localisation = document.getElementById('location').value;
        if (!payload.nom_boutique || !payload.localisation) { showToast('Infos boutique manquantes'); return; }
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      const base = window.API_BASE || 'http://localhost:8000/api';
      try {
        const response = await fetch(`${base}/inscription`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (response.ok) {
          // PROTECTION: Clear all previous session/visitor data to prevent leakage
          localStorage.removeItem('gold_user');
          localStorage.removeItem('gold_cart');
          localStorage.removeItem('gold_favs');
          localStorage.removeItem('visitor_uuid');
          localStorage.removeItem('visitor_cart');
          localStorage.removeItem('visitor_favs');

          const userForLocal = {
            id: data.user_id,
            id_user: data.user_id,
            role: currentRole,
            nom: lastName,
            prenom: firstName,
            email: email,
            nom_boutique: payload.nom_boutique || ''
          };
          localStorage.setItem('gold_user', JSON.stringify(userForLocal));
          document.getElementById('successOverlay').classList.add('show');
          setTimeout(() => {
            window.location.href = currentRole === 'VENDEUR' ? '../seller/dashboard.html' : '../acheteur/index.html';
          }, 2000);
        } else {
          showToast(data.message || "Erreur d'inscription");
          btn.disabled = false;
          btn.textContent = 'Créer mon compte';
        }
      } catch (err) {
        showToast('Erreur serveur');
        btn.disabled = false;
        btn.textContent = 'Créer mon compte';
      }
    });
  </script>
</body>
</html>
