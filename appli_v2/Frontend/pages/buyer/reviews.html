<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Avis — Gold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&family=Special+Elite&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/buyer.css">
</head>
<body>
<div class="search-overlay" id="searchOverlay"><button class="search-close">&times;</button><div class="search-box"><i class="fas fa-search"></i><input type="text" placeholder="Rechercher…"></div></div>
<header class="navbar scrolled" id="navbar"><div class="nav-wrap"><a href="../../index.html" class="logo">G<span>old</span></a></div></header>
<div class="mob-nav" id="mobNav"></div>

<section class="buyer-page-header">
  <div class="wrap">
    <div class="bph-inner">
      <div>
        <div class="bph-breadcrumb"><a href="../../index.html">Accueil</a><span class="bph-sep">›</span><a href="profile.html">Mon compte</a><span class="bph-sep">›</span><span>Mes avis</span></div>
        <h1 class="bph-title">Mes <em>Avis</em></h1>
        <p class="bph-subtitle">Tous les avis que vous avez laissés sur vos achats</p>
      </div>
    </div>
  </div>
</section>

<section class="buyer-content">
  <div class="wrap">
    <div id="reviewsList">
      <div style="text-align:center;padding:60px"><i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--honey)"></i></div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="wrap">
    <div class="ftop">
      <div class="fbrand"><div class="flogo">G<span>old</span></div><p>La marketplace de référence pour la musique vintage.</p></div>
      <div class="fcol"><div class="fctitle">Mon compte</div><a href="profile.html">Mon profil</a><a href="orders.html">Mes commandes</a><a href="settings.html">Paramètres</a></div>
      <div class="fcol"><div class="fctitle">Contact</div><a href="mailto:contact@gold.fr">contact@gold.fr</a></div>
    </div>
    <div class="fbot"><span>© 2026 Gold Marketplace</span></div>
  </div>
</footer>
<button class="up-btn" id="upBtn"><i class="fas fa-arrow-up"></i></button>
<div class="toast" id="toast"><i class="fas fa-check"></i> <span id="tmsg"></span></div>

<script src="../../js/auth-system.js"></script>
<script src="../../js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  initGoldNavbar('reviews');
  const user = GoldAuth.getUser();
  if (!user) { window.location.href = '../../auth/sign-in.html'; return; }
  loadReviews(user);
});

async function loadReviews(user) {
  let reviews = [];
  try {
    const uid = user.id_user || user.id;
    const res = await fetch(`http://localhost:8000/api/acheteurs/${uid}/avis`);
    if (res.ok) {
      reviews = await res.json();
      if (!Array.isArray(reviews)) reviews = reviews.data || [];
    }
  } catch(e) {
    reviews = getDemoReviews();
  }

  renderReviews(reviews);
}

function renderReviews(reviews) {
  const container = document.getElementById('reviewsList');

  if (reviews.length === 0) {
    container.innerHTML = `
      <div class="buyer-empty">
        <div class="be-icon">⭐</div>
        <div class="be-title">Aucun avis pour le moment</div>
        <div class="be-desc">Après réception de vos commandes, vous pourrez laisser un avis sur chaque produit acheté.</div>
        <a href="orders.html" class="be-cta">Voir mes commandes <span>→</span></a>
      </div>`;
    return;
  }

  container.innerHTML = reviews.map((review, i) => {
    const stars = '★'.repeat(review.note || 5) + '☆'.repeat(5 - (review.note || 5));
    const date = review.created_at ? new Date(review.created_at).toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'}) : '—';

    return `
      <div class="review-card" style="opacity:0;transform:translateY(14px);transition:all 0.4s ease ${i*0.08}s">
        <div class="rc-header">
          <div class="rc-product-thumb">${review.product_image ? `<img src="${review.product_image}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">` : '🎵'}</div>
          <div class="rc-info">
            <div class="rc-product-name">${review.product_name || review.produit_nom || 'Produit'}</div>
            <div class="rc-product-meta">${review.product_category || 'Vinyle'}</div>
            <div class="rc-stars">${stars}</div>
          </div>
          <div class="rc-date">${date}</div>
        </div>
        <div class="rc-text">${review.commentaire || review.text || ''}</div>
        ${review.seller_reply ? `
          <div class="rc-seller-reply">
            <div class="rc-reply-header">
              <div class="rc-reply-av">${(review.seller_name||'V')[0]}</div>
              <span class="rc-reply-name">${review.seller_name || 'Vendeur'}</span>
              <span class="rc-reply-badge">Vendeur</span>
            </div>
            <div class="rc-reply-text">${review.seller_reply}</div>
          </div>
        ` : ''}
        <div class="rc-actions">
          <button class="oc-btn" onclick="editReview(${review.id || i})"><i class="fas fa-pen" style="font-size:0.68rem"></i> Modifier</button>
          <a href="../../product.html?id=${review.product_id||''}" class="oc-btn">Voir le produit</a>
        </div>
      </div>
    `;
  }).join('');

  // Animate in
  requestAnimationFrame(() => {
    container.querySelectorAll('.review-card').forEach(card => {
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';
    });
  });
}

function editReview(id) {
  showToast('✏️ Modification d\'avis bientôt disponible');
}

function getDemoReviews() {
  return [
    {
      id: 1, product_name: 'Led Zeppelin IV', product_category: 'Vinyle · 1971',
      note: 5, commentaire: 'Vinyle en excellent état, pochette impeccable. Le son est incroyable, on ressent toute la profondeur des enregistrements originaux. Emballage soigné, livraison rapide. Je recommande ce vendeur !',
      created_at: '2026-03-30T12:00:00Z',
      seller_name: 'Jean-Pierre V.',
      seller_reply: 'Merci beaucoup Sophie ! Ravi que le vinyle vous plaise. N\'hésitez pas à revenir, j\'ai reçu de nouveaux pressages UK originaux.',
      product_id: 'led-zeppelin-iv'
    },
    {
      id: 2, product_name: 'The Wall', product_category: 'Vinyle · 1979',
      note: 4, commentaire: 'Très bon vinyle, quelques légères traces d\'usure sur la pochette mais le disque est parfait. Bon rapport qualité-prix.',
      created_at: '2026-03-30T12:00:00Z',
      product_id: 'the-wall'
    },
  ];
}
</script>
</body>
</html>
