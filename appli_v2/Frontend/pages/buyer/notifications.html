<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — Gold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&family=Special+Elite&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/buyer.css">
</head>
<body>
<div class="search-overlay" id="searchOverlay"><button class="search-close">&times;</button><div class="search-box"><i class="fas fa-search"></i><input type="text" placeholder="Rechercher…"></div></div>
<header class="navbar scrolled" id="navbar"><div class="nav-wrap"><a href="../../index.html" class="logo">G<span>old</span></a></div></header>
<div class="mob-nav" id="mobNav"></div>

<section class="buyer-page-header">
  <div class="wrap">
    <div class="bph-inner">
      <div>
        <div class="bph-breadcrumb"><a href="../../index.html">Accueil</a><span class="bph-sep">›</span><span>Notifications</span></div>
        <h1 class="bph-title"><em>Notifications</em></h1>
        <p class="bph-subtitle">Restez informé de l'état de vos commandes et des offres spéciales</p>
      </div>
      <button class="phc-edit-btn" id="markAllRead" style="margin-bottom:8px">
        <i class="fas fa-check-double"></i> Tout marquer comme lu
      </button>
    </div>
  </div>
</section>

<section class="buyer-content">
  <div class="wrap" style="max-width:800px">

    <div class="buyer-filters" style="margin-bottom:24px">
      <button class="bf-tab active" data-filter="all">Toutes</button>
      <button class="bf-tab" data-filter="order">Commandes</button>
      <button class="bf-tab" data-filter="promo">Promotions</button>
      <button class="bf-tab" data-filter="review">Avis</button>
      <button class="bf-tab" data-filter="system">Système</button>
    </div>

    <div id="notifList">
      <div style="text-align:center;padding:60px"><i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--honey)"></i></div>
    </div>

  </div>
</section>

<footer class="footer">
  <div class="wrap">
    <div class="ftop">
      <div class="fbrand"><div class="flogo">G<span>old</span></div><p>La marketplace de référence pour la musique vintage.</p></div>
      <div class="fcol"><div class="fctitle">Mon compte</div><a href="profile.html">Mon profil</a><a href="orders.html">Mes commandes</a></div>
      <div class="fcol"><div class="fctitle">Contact</div><a href="mailto:contact@gold.fr">contact@gold.fr</a></div>
    </div>
    <div class="fbot"><span>© 2026 Gold Marketplace</span></div>
  </div>
</footer>
<button class="up-btn" id="upBtn"><i class="fas fa-arrow-up"></i></button>
<div class="toast" id="toast"><i class="fas fa-check"></i> <span id="tmsg"></span></div>

<script src="../../js/auth-system.js"></script>
<script src="../../js/main.js"></script>
<script>
let allNotifs = [];

document.addEventListener('DOMContentLoaded', () => {
  initGoldNavbar('notifications');
  const user = GoldAuth.getUser();
  if (!user) { window.location.href = '../../auth/sign-in.html'; return; }
  loadNotifications(user);
  setupFilters();
  document.getElementById('markAllRead').addEventListener('click', markAllRead);
});

async function loadNotifications(user) {
  try {
    const uid = user.id_user || user.id;
    const res = await fetch(`http://localhost:8000/api/acheteurs/${uid}/notifications`);
    if (res.ok) {
      allNotifs = await res.json();
      if (!Array.isArray(allNotifs)) allNotifs = allNotifs.data || [];
    }
  } catch(e) {
    allNotifs = getDemoNotifs();
  }
  renderNotifs(allNotifs);
}

function renderNotifs(notifs) {
  const container = document.getElementById('notifList');

  if (notifs.length === 0) {
    container.innerHTML = `
      <div class="buyer-empty">
        <div class="be-icon">🔔</div>
        <div class="be-title">Aucune notification</div>
        <div class="be-desc">Vous serez notifié des mises à jour de vos commandes, promotions et réponses des vendeurs.</div>
        <a href="../../catalogue.html" class="be-cta">Explorer le catalogue <span>→</span></a>
      </div>`;
    return;
  }

  container.innerHTML = notifs.map((n, i) => {
    const typeConfig = {
      order: { icon: 'fa-box', css: 'order' },
      commande: { icon: 'fa-box', css: 'order' },
      promo: { icon: 'fa-tag', css: 'promo' },
      promotion: { icon: 'fa-tag', css: 'promo' },
      delivery: { icon: 'fa-truck', css: 'delivery' },
      livraison: { icon: 'fa-truck', css: 'delivery' },
      review: { icon: 'fa-star', css: 'review' },
      avis: { icon: 'fa-star', css: 'review' },
      price: { icon: 'fa-arrow-down', css: 'price' },
      system: { icon: 'fa-bell', css: 'system' },
    };
    const tc = typeConfig[n.type] || typeConfig.system;
    const time = n.created_at ? timeAgo(new Date(n.created_at)) : '';
    const unread = !n.est_lue && !n.read;

    return `
      <div class="notif-card ${unread ? 'unread' : ''}" data-type="${n.type}" style="position:relative;opacity:0;transform:translateY(10px);transition:all 0.3s ease ${i*0.05}s" onclick="markRead(${n.id||i})">
        <div class="nc-icon ${tc.css}"><i class="fas ${tc.icon}"></i></div>
        <div class="nc-body">
          <div class="nc-title">${n.titre || n.title || 'Notification'}</div>
          <div class="nc-text">${n.contenu || n.content || n.message || ''}</div>
          <div class="nc-time">${time}</div>
        </div>
      </div>
    `;
  }).join('');

  requestAnimationFrame(() => {
    container.querySelectorAll('.notif-card').forEach(card => {
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';
    });
  });
}

function setupFilters() {
  document.querySelectorAll('.bf-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.bf-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const filter = tab.dataset.filter;
      const filtered = filter === 'all' ? allNotifs : allNotifs.filter(n => {
        const typeMap = { order: ['order','commande'], promo: ['promo','promotion','price'], review: ['review','avis'], system: ['system'] };
        return (typeMap[filter] || [filter]).includes(n.type);
      });
      renderNotifs(filtered);
    });
  });
}

async function markRead(id) {
  const card = document.querySelector(`.notif-card[onclick*="${id}"]`);
  if (card) card.classList.remove('unread');
  const notif = allNotifs.find(n => (n.id||0) === id);
  if (notif) { notif.est_lue = true; notif.read = true; }
  try {
    const user = GoldAuth.getUser();
    const uid = user.id_user || user.id;
    await fetch(`http://localhost:8000/api/acheteurs/${uid}/notifications/${id}/lue`, { method: 'PUT' });
  } catch(e) {}
}

function markAllRead() {
  allNotifs.forEach(n => { n.est_lue = true; n.read = true; });
  document.querySelectorAll('.notif-card.unread').forEach(card => card.classList.remove('unread'));
  showToast('✓ Toutes les notifications marquées comme lues');
  // API call
  try {
    const user = GoldAuth.getUser();
    const uid = user.id_user || user.id;
    fetch(`http://localhost:8000/api/acheteurs/${uid}/notifications/lire-tout`, { method: 'PUT' }).catch(() => {});
  } catch(e) {}
}

function timeAgo(date) {
  const seconds = Math.floor((new Date() - date) / 1000);
  if (seconds < 60) return 'À l\'instant';
  if (seconds < 3600) return Math.floor(seconds/60) + ' min';
  if (seconds < 86400) return Math.floor(seconds/3600) + ' h';
  if (seconds < 604800) return Math.floor(seconds/86400) + ' j';
  return date.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
}

function getDemoNotifs() {
  const now = Date.now();
  return [
    { id:1, type:'order', titre:'Commande expédiée', contenu:'Votre commande #GLD-1002 (Kind of Blue) a été expédiée. Livraison estimée : 8 avril.', created_at: new Date(now - 3600000*2).toISOString(), est_lue: false },
    { id:2, type:'delivery', titre:'Commande livrée', contenu:'Votre commande #GLD-1001 (Led Zeppelin IV, The Wall) a été livrée avec succès ! N\'oubliez pas de laisser un avis.', created_at: new Date(now - 86400000*2).toISOString(), est_lue: false },
    { id:3, type:'promo', titre:'Vente flash ce week-end', contenu:'Profitez de -20% sur toute la catégorie Vinyles Jazz ce samedi et dimanche avec le code JAZZ20.', created_at: new Date(now - 86400000*3).toISOString(), est_lue: true },
    { id:4, type:'price', titre:'Baisse de prix sur un favori', contenu:'Le prix de "Dark Side of the Moon" est passé de 112 € à 95 €. C\'est le moment !', created_at: new Date(now - 86400000*4).toISOString(), est_lue: true },
    { id:5, type:'review', titre:'Réponse du vendeur', contenu:'Jean-Pierre V. a répondu à votre avis sur "Led Zeppelin IV" : "Merci beaucoup ! N\'hésitez pas à revenir…"', created_at: new Date(now - 86400000*5).toISOString(), est_lue: true },
    { id:6, type:'system', titre:'Bienvenue sur Gold !', contenu:'Votre compte a été créé avec succès. Explorez notre catalogue de musique vintage et trouvez vos pépites.', created_at: new Date(now - 86400000*10).toISOString(), est_lue: true },
  ];
}
</script>
</body>
</html>
