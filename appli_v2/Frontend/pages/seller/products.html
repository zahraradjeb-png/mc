<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Produits — Gold Seller Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles/seller-base.css">
  <link rel="stylesheet" href="styles/seller-layout.css">
  <link rel="stylesheet" href="styles/seller-products.css">
</head>
<body class="seller-studio">

<button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu"><i class="fas fa-bars"></i></button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div id="studio-toast"></div>

<div class="studio-layout">
  <div id="sidebar-container"></div>

  <main class="studio-main animate-slide">
    <div id="header-container"></div>

    <!-- Filters row -->
    <div class="search-filter-row">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="p-search" placeholder="Rechercher par titre, artiste…" autocomplete="off">
      </div>
      <select id="filter-status" class="select-studio">
        <option value="all">Tous les statuts</option>
        <option value="available">Disponible</option>
        <option value="out">Indisponible</option>
      </select>
      <select id="filter-cat" class="select-studio">
        <option value="all">Toutes catégories</option>
        <option value="VINYLE">Vinyle</option>
        <option value="CD">CD</option>
        <option value="CASSETTE">Cassette</option>
        <option value="POSTER">Poster</option>
        <option value="INSTRUMENT">Instrument</option>
      </select>
    </div>

    <!-- Product count bar -->
    <div class="products-meta" id="products-meta" style="display:none">
      <span id="products-count-label"></span>
      <div style="margin-left:auto; display:flex; gap:8px;">
        <button class="view-toggle active" id="view-grid" title="Vue grille"><i class="fas fa-th"></i></button>
        <button class="view-toggle" id="view-list" title="Vue liste"><i class="fas fa-list"></i></button>
      </div>
    </div>

    <!-- Inventory grid -->
    <div id="inventory-grid" class="inventory-grid">
      <div class="loading-pulse-container" style="grid-column:1/-1">
        <div class="loading-pulse" style="height:300px;border-radius:18px;"></div>
        <div class="loading-pulse" style="height:300px;border-radius:18px;"></div>
        <div class="loading-pulse" style="height:300px;border-radius:18px;"></div>
        <div class="loading-pulse" style="height:300px;border-radius:18px;"></div>
      </div>
    </div>
  </main>
</div>

<script src="../../js/auth-system.js"></script>
<script src="services/seller-auth.js"></script>
<script src="services/products.service.js"></script>
<script src="components/sidebar.js"></script>
<script src="components/header.js"></script>
<script src="components/seller-layout.js"></script>
<script src="scripts/products.js"></script>
</body>
</html>
