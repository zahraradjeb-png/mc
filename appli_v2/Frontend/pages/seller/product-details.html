<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détails du Produit — Gold Seller Studio</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles/seller-base.css">
  <link rel="stylesheet" href="styles/seller-layout.css">
  <link rel="stylesheet" href="styles/seller-product-details.css">
</head>

<body class="seller-studio">

  <div class="studio-layout">
    <div id="sidebar-container"></div>

    <main class="studio-main animate-slide">
      <header class="studio-header">
        <div class="welcome-msg">
          <p id="p-cat-mini">Vinyle Original</p>
          <h1 id="p-title-header">Pack Vinyle Jazz 1960</h1>
        </div>
        <div class="header-actions">
          <button class="btn-gold-studio" onclick="history.back()" style="background:rgba(255,255,255,0.05); color:#fff; box-shadow:none;">Retour</button>
          <a href="#" class="btn-gold-studio">
            <i class="fas fa-edit"></i> Modifier
          </a>
        </div>
      </header>

      <div class="product-details-grid">
        <div class="studio-card p-gallery-card">
          <img src="../../assets/img/placeholder-vinyl.png" id="p-main-img" class="p-gallery-main">
        </div>

        <div class="studio-card p-info-card">
          <div class="p-header">
            <div>
              <span class="badge-status st-active">Public</span>
              <h2 class="p-title">Pack Vinyle Jazz 1960</h2>
            </div>
            <div style="font-size: 2rem; font-weight: 700; color: var(--studio-honey);">45.00 €</div>
          </div>
          
          <p style="opacity: 0.8; line-height: 1.7; font-size: 1.05rem;">
            Un classique indémodable de la scène jazz des années 60, pressage ORIGINAL de chez Blue Note Records.
          </p>

          <div class="p-stat-group">
            <div class="p-mini-stat">
              <span class="p-ms-lbl">Ventes</span>
              <span class="p-ms-val">124</span>
            </div>
            <div class="p-mini-stat">
              <span class="p-ms-lbl">Vues</span>
              <span class="p-ms-val">1,240</span>
            </div>
            <div class="p-mini-stat">
              <span class="p-ms-lbl">Stock</span>
              <span class="p-ms-val">12</span>
            </div>
          </div>

          <section class="performance-section">
            <h3 class="section-title" style="font-size: 1.1rem;"><i class="fas fa-chart-bar"></i> Performance (30j)</h3>
            <div style="height: 200px; background: rgba(255,255,255,0.01); border: 1px dashed var(--studio-border); border-radius: 20px; display: flex; align-items: center; justify-content: center; color: var(--studio-muted);">
              Graphique des vues & conversions
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <!-- Common Libraries -->
  <script src="../../js/auth-system.js"></script>
  
  <!-- Modular Services -->
  <script src="services/seller-auth.js"></script>
  
  <!-- Shared Components -->
  <script src="components/sidebar.js"></script>
  <script src="components/header.js"></script>
  <script src="components/seller-layout.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await SellerLayout.init({
        title: '', // Title is in custom header
        pageId: 'products'
      });
      if (!user) return;
    });
  </script>
</body>
</html>
