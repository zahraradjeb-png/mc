<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finances — Gold Seller Studio</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles/seller-base.css">
  <link rel="stylesheet" href="styles/seller-layout.css">
  <link rel="stylesheet" href="styles/seller-finance.css">
</head>

<body class="seller-studio">

  <div class="studio-layout">
    <div id="sidebar-container"></div>

    <main class="studio-main animate-slide">
      <header class="studio-header">
        <div class="welcome-msg">
          <p>Revenus et paiements</p>
          <h1>Mes Finances</h1>
        </div>
        <div class="header-actions">
           <button class="btn-gold-studio">Demander un Virement</button>
        </div>
      </header>

      <div class="finance-summary">
        <div class="balance-card">
          <div style="font-size:0.8rem; text-transform:uppercase; font-weight:700;">Solde Disponible</div>
          <span class="balance-val">1,245.80 €</span>
          <button class="btn-gold-studio" style="margin-top:24px; background:#1c0f07; color:#fff; border:none; padding:10px 20px;">Transférer vers banque</button>
        </div>
        
        <div class="studio-card stat-card" style="padding:40px;">
          <div class="stat-info">
            <span class="stat-label">Revenus ce mois</span>
            <h2 style="font-size:1.8rem; color:#fff;">+ 420.00 €</h2>
          </div>
        </div>
        
        <div class="studio-card stat-card" style="padding:40px;">
          <div class="stat-info">
            <span class="stat-label">Frais de commission (8%)</span>
            <h2 style="font-size:1.8rem; color:var(--studio-muted);">0.00 €</h2>
          </div>
        </div>
      </div>

      <div class="transaction-list studio-card" style="padding:0; overflow:hidden;">
        <div style="padding:24px; border-bottom:1px solid var(--studio-border);">
            <h3 class="section-title"><i class="fas fa-list-ul"></i> Historique des Transactions</h3>
        </div>
        
        <div class="t-row">
          <div class="t-info">
            <div class="t-icon"><i class="fas fa-arrow-down" style="color:#22C55E;"></i></div>
            <div>
              <div style="font-weight:600; color:#fff;">Vente #ORD-2024-88A9</div>
              <div style="font-size:0.75rem; color:var(--studio-muted);">Hier, 14:22</div>
            </div>
          </div>
          <div class="t-amt plus">+ 60.00 €</div>
        </div>
        
        <div class="t-row">
          <div class="t-info">
            <div class="t-icon"><i class="fas fa-university"></i></div>
            <div>
              <div style="font-weight:600; color:#fff;">Virement bancaire (Reçu)</div>
              <div style="font-size:0.75rem; color:var(--studio-muted);">02 Avril 2024</div>
            </div>
          </div>
          <div class="t-amt">- 800.00 €</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Common Libraries -->
  <script src="../js/api-config.js"></script>
  <script src="../js/auth-system.js"></script>
  
  <!-- Modular Services -->
  <script src="services/seller-auth.js"></script>
  <script src="services/products.service.js"></script>
  
  <!-- Shared Components -->
  <script src="components/sidebar.js"></script>
  <script src="components/header.js"></script>
  <script src="components/seller-layout.js"></script>
  
  <!-- Controller -->
  <script src="scripts/finance.js"></script>
</body>
</html>
