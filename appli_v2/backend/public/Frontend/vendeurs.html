<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Découvrir nos Vendeurs — Gold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&family=Special+Elite&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ── Vinyl Profile Design ── */
    .seller-vinyl-wrap {
      width: 140px; height: 140px;
      position: relative;
      background: #0a0502;
      border-radius: 50%;
      padding: 4px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 10px rgba(229,166,87,0.1);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      flex-shrink: 0;
      cursor: pointer;
      border: 1px solid rgba(229,166,87,0.05);
    }
    .seller-vinyl-wrap::before {
      content: ''; position: absolute; inset: 0;
      border-radius: 50%;
      background: repeating-radial-gradient(circle, #1a1a1a 0, #1a1a1a 1px, transparent 2px, transparent 4px);
      opacity: 0.5; pointer-events: none;
    }
    .seller-vinyl-wrap:hover { 
      transform: scale(1.08) rotate(15deg);
      box-shadow: 0 15px 50px rgba(0,0,0,1);
    }
    .seller-av {
      width: 100%; height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #1c0f07;
      background: linear-gradient(135deg, #1c0f07, #2d1b0a);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; font-family: 'Cormorant', serif; color: #E5A657;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .seller-av img { width: 100%; height: 100%; object-fit: cover; filter: sepia(0.2) contrast(1.1); }
    .vinyl-hole {
      position: absolute; top: 50%; left: 50%;
      width: 14px; height: 14px;
      background: #0a0502;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(229,166,87,0.4);
      box-shadow: inset 0 0 5px #000, 0 0 10px rgba(229,166,87,0.2);
      z-index: 2;
    }

    .seller-row {
      margin-bottom: 80px;
      display: flex; flex-direction: column; gap: 30px;
      padding-bottom: 50px; border-bottom: 1px solid rgba(229,166,87,0.1);
    }
    .seller-info-top { display: flex; align-items: center; gap: 25px; }
    .seller-name-box h2 { font-family: 'Cormorant', serif; font-size: 2.2rem; margin: 0; color: #F5E2CE; }
    .seller-name-box p { font-family: 'Jost', sans-serif; color: #E5A657; letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.75rem; }

    .seller-products-preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    /* Page Container */
    .vendeurs-page { padding-top: 140px; min-height: 80vh; }
  </style>
</head>
<body>

<!-- SEARCH OVERLAY -->
<div class="search-overlay" id="searchOverlay">
  <button class="search-close">&times;</button>
  <div class="search-box">
    <i class="fas fa-search"></i>
    <input type="text" placeholder="Rechercher des produits ou vendeurs..." />
  </div>
</div>

<!-- NAVBAR -->
<header class="navbar" id="navbar">
  <div class="nav-wrap">
    <a href="index.html" class="logo">G<span>old</span></a>
    <!-- Injected by auth-system.js -->
  </div>
</header>

<main class="vendeurs-page">
  <div class="wrap">
    <div class="sec-hd" style="margin-bottom: 60px;">
      <div>
        <div class="sec-lbl">La Communauté</div>
        <h1 class="sec-ttl" style="font-size: 3.5rem;">Découvrez nos <em>Vendeurs</em></h1>
      </div>
      <p style="max-width: 500px; color: rgba(245,226,206,.6); line-height: 1.7;">Parcourez les boutiques de nos passionnés et découvrez leurs pépites musicales méticuleusement sélectionnées.</p>
    </div>

    <div id="sellersContainer">
      <!-- Dynamically loaded -->
      <div style="text-align: center; padding: 100px;">
        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: #E5A657;"></i>
        <p style="margin-top: 20px; opacity: 0.5;">Chargement des vendeurs...</p>
      </div>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="footer" id="footer"></footer>

<script src="js/api-config.js"></script>
<script src="js/auth-system.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    // Inject navbar
    if (typeof initGoldNavbar === 'function') initGoldNavbar('vendeurs');
    
    const container = document.getElementById('sellersContainer');
    try {
      const response = await fetch('http://localhost:8000/api/vendeurs-overview');
      if (!response.ok) throw new Error('Failed to load sellers');
      const data = await response.json();

      if (data.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding:50px; opacity:0.6;">Aucun vendeur trouvé.</p>';
        return;
      }

      container.innerHTML = data.map(entry => {
        const s = entry.seller;
        const products = entry.products;
        const initials = (s.prenom || 'V')[0].toUpperCase();
        const shopName = s.nom_boutique || (s.prenom + ' ' + (s.nom || ''));
        const profileImg = s.photo_profil ? `http://localhost:8000/${s.photo_profil}` : '';

        return `
          <div class="seller-row">
            <div class="seller-info-top">
              <div class="seller-vinyl-wrap" onclick="window.location.href='vendeur-detail.html?id=${s.id_user}'">
                <div class="seller-av">
                  ${profileImg ? `<img src="${profileImg}" alt="${shopName}">` : initials}
                </div>
                <div class="vinyl-hole"></div>
              </div>
              <div class="seller-name-box">
                <p>Passionné Gold</p>
                <h2 onclick="window.location.href='vendeur-detail.html?id=${s.id_user}'" style="cursor:pointer">${shopName}</h2>
                <div style="margin-top: 5px; color: #E5A657; font-size: 0.8rem; cursor:pointer;" onclick="showToast('Avis clients bientôt disponibles pour ce vendeur !', 'info')">
                  <i class="fas fa-star"></i> 5.0 · ${products.length} produits validés
                </div>
              </div>
              <a href="vendeur-detail.html?id=${s.id_user}" class="sec-more" style="margin-left:auto">Voir toute la boutique →</a>
            </div>

            <div class="seller-products-preview">
              ${products.length > 0 ? products.map(p => {
                const img = p.photo_principale ? `http://localhost:8000/${p.photo_principale}` : '';
                const emoji = { 'VINYLE': '🎵', 'CASSETTE': '📼', 'INSTRUMENT': '🎸', 'POSTER': '🖼️', 'CD': '💿' }[p.categorie_nom] || '🎵';
                const price = parseFloat(p.prix).toLocaleString('fr-FR', { minimumFractionDigits: 2 }) + ' €';
                
                return `
                  <article class="pcard" data-pid="${p.id_produit}" data-price="${p.prix}">
                    <a href="product.html?id=${p.id_produit}" class="pcard-link"></a>
                    <div class="pthumb">
                      ${img ? `<img src="${img}" alt="${p.titre}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
                      <div class="pemoji" style="${img ? 'display:none' : 'display:flex'}">${emoji}</div>
                      <button class="pfav" data-pid="${p.id_produit}">♡</button>
                      <div class="padd" data-pid="${p.id_produit}" data-p="${p.titre}" data-price="${p.prix}">
                        <i class="fas fa-shopping-bag"></i> Ajouter
                      </div>
                    </div>
                    <div class="pbody">
                      <div class="pmeta">${p.categorie_nom}</div>
                      <div class="pname">${p.titre}</div>
                      <div class="pfoot">
                        <span class="pprice">${price}</span>
                        <span class="pstars">★★★★★</span>
                      </div>
                    </div>
                  </article>
                `;
              }).join('') : '<p style="grid-column:1/-1; opacity:0.4;">Bientôt de nouveaux produits...</p>'}
            </div>
          </div>
        `;
      }).join('');

      if (typeof initCartAndFavButtons === 'function') initCartAndFavButtons();

    } catch (err) {
      container.innerHTML = '<p style="text-align:center; color:red;">Erreur lors du chargement des vendeurs.</p>';
      console.error(err);
    }
  });
</script>
</body>
</html>
